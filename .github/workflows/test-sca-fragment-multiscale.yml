name: Test SCA fragment multiscale diagnostics
on:
  push:
    paths:
      - "scripts/probe_sca_fragment_multiscale_matches.py"
      - "tests/test_probe_sca_fragment_multiscale_matches.py"
      - ".github/workflows/test-sca-fragment-multiscale.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install "mapbox-vector-tile>=2,<3" "shapely>=2,<3" "pyproj>=3.6,<4" "requests>=2.31,<3" pytest
      - name: Compile and run regression tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m py_compile scripts/probe_sca_fragment_multiscale_matches.py
          python -m pytest -q tests/test_probe_sca_fragment_multiscale_matches.py
