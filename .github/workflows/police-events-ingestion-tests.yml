name: Police events ingestion tests

on:
  pull_request:
    paths:
      - 'scripts/ingest_police_events.py'
      - 'tests/test_police_events_adaptive_pagination.py'
      - '.github/workflows/police-events-ingestion-tests.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/ingest_police_events.py'
      - 'tests/test_police_events_adaptive_pagination.py'
      - '.github/workflows/police-events-ingestion-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ingestion test dependency
        run: python -m pip install requests
      - name: Run police events ingestion tests
        run: python -m unittest tests.test_police_events_adaptive_pagination
