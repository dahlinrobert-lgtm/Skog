name: Collect Länsstyrelsen case handling metadata

on:
  workflow_dispatch:
    inputs:
      restore_only:
        description: Restore historical data and rebuild analysis without scraping new cases
        required: true
        default: true
        type: boolean
      limit:
        description: Maximum cases per run (0 = all eligible cases; use 50 for routine runs)
        required: true
        default: "50"
        type: string
  schedule:
    - cron: "43 5 * * *"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: lansstyrelsen-case-handling-history
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Fetch trusted pre-regression baseline
        run: git fetch --no-tags --depth=1 origin e5e10effd88ce693e6f008ad1ea543166331dffe
      - name: Restore historical fields and handling rows before collection
        run: |
          python scripts/restore_lansstyrelsen_case_history.py \
            --baseline-ref e5e10effd88ce693e6f008ad1ea543166331dffe \
            --report lansstyrelsen-history-restoration-report.json
      - name: Collect case and handling metadata
        if: ${{ inputs.restore_only != true }}
        run: |
          limit="${{ inputs.limit }}"
          if [ -z "$limit" ]; then limit="50"; fi
          python scripts/collect_lansstyrelsen_case_handlings.py --limit "$limit"
      - name: Test collection retry and history preservation
        run: python -m unittest discover -s tests -p 'test_lansstyrelsen_case_collection.py'
      - name: Analyze quality, handling classes and execution leads
        run: |
          python -m unittest discover -s tests -p 'test_lansstyrelsen_handlings_analysis.py'
          python -m unittest discover -s tests -p 'test_lansstyrelsen_action_leads.py'
          python scripts/analyze_lansstyrelsen_handlings.py
          python scripts/classify_lansstyrelsen_action_leads.py
      - name: Create or update metadata history pull request
        if: success() && github.ref == 'refs/heads/main'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ github.token }}
          branch: automation/lansstyrelsen-case-handling-history
          delete-branch: false
          add-paths: |
            data/lansstyrelsen-diary/case-details.json
            data/lansstyrelsen-diary/handling-events.jsonl
            data/lansstyrelsen-diary/analysis/
            lansstyrelsen-history-restoration-report.json
          commit-message: "Restore and update Länsstyrelsen case handling history"
          title: "Restore and update Länsstyrelsen case handling history"
          body: |
            ## Automated Länsstyrelsen case-handling history update

            This PR contains conservatively restored historical case metadata, plus refreshed analysis and (unless restore-only mode was selected) newly collected metadata.

            - Historical restoration runs before optional scraping.
            - Collection and validation tests run before publishing.
            - Changes are proposed for review instead of pushing directly to `main`.
            - The stable automation branch is updated on subsequent scheduled runs.

            Please review the restoration report and data changes before merging.
      - name: Upload collection, restoration, and analysis reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lansstyrelsen-case-handling-restoration
          path: |
            case-handling-run.json
            lansstyrelsen-history-restoration-report.json
            data/lansstyrelsen-diary/analysis/
          if-no-files-found: warn
          retention-days: 30
