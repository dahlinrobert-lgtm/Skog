name: Collect Länsstyrelsen case handling metadata

on:
  workflow_dispatch:
    inputs:
      limit:
        description: Maximum cases per run (0 = all eligible cases)
        required: true
        default: "50"
        type: string
  schedule:
    - cron: "43 5 * * *"

permissions:
  contents: write

concurrency:
  group: lansstyrelsen-case-handling-history
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Collect case and handling metadata
        run: |
          limit="${{ inputs.limit }}"
          if [ -z "$limit" ]; then limit="50"; fi
          python scripts/collect_lansstyrelsen_case_handlings.py --limit "$limit"
      - name: Test collection retry behavior
        run: python -m unittest discover -s tests -p 'test_lansstyrelsen_case_collection.py'
      - name: Analyze quality, handling classes and execution leads
        run: |
          python -m unittest discover -s tests -p 'test_lansstyrelsen_handlings_analysis.py'
          python -m unittest discover -s tests -p 'test_lansstyrelsen_action_leads.py'
          python scripts/analyze_lansstyrelsen_handlings.py
          python scripts/classify_lansstyrelsen_action_leads.py
      - name: Publish metadata history and analysis
        if: success() && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/lansstyrelsen-diary/case-details.json data/lansstyrelsen-diary/handling-events.jsonl data/lansstyrelsen-diary/analysis/
          if git diff --cached --quiet; then
            echo "No case, handling metadata or analysis changes."
          else
            git commit -m "Update Länsstyrelsen case handling history and analysis"

            # Other workflows may update main while this collection is running.
            # Rebase our data commit onto the latest main before pushing, and
            # retry if another workflow wins the race between fetch and push.
            for attempt in 1 2 3; do
              git fetch origin main
              if ! git rebase origin/main; then
                git rebase --abort || true
                echo "::error::Could not rebase collection results onto main; refusing to overwrite concurrent changes."
                exit 1
              fi

              if git push origin HEAD:main; then
                echo "Published collection results on main."
                exit 0
              fi

              echo "Push attempt ${attempt} rejected; refreshing main before retry."
              sleep $((attempt * 2))
            done

            echo "::error::Could not publish after three attempts because main kept changing."
            exit 1
          fi
      - name: Upload collection and analysis reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lansstyrelsen-case-handling-analysis
          path: |
            case-handling-run.json
            data/lansstyrelsen-diary/analysis/
          if-no-files-found: warn
          retention-days: 30
