name: Collect Länsstyrelsen case handling metadata

on:
  workflow_dispatch:
    inputs:
      limit:
        description: Maximum cases per run (0 = all eligible cases)
        required: true
        default: "50"
        type: string
  schedule:
    - cron: "43 5 * * *"

permissions:
  contents: write

concurrency:
  group: lansstyrelsen-case-handling-history
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Collect case and handling metadata
        run: |
          limit="${{ inputs.limit }}"
          if [ -z "$limit" ]; then limit="50"; fi
          python scripts/collect_lansstyrelsen_case_handlings.py --limit "$limit"
      - name: Publish metadata history
        if: success() && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/lansstyrelsen-diary/case-details.json data/lansstyrelsen-diary/handling-events.jsonl
          if git diff --cached --quiet; then
            echo "No case or handling metadata changes."
          else
            git commit -m "Update Länsstyrelsen case handling history"
            git push origin HEAD:main
          fi
      - name: Upload collection report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lansstyrelsen-case-handling-history
          path: case-handling-run.json
          if-no-files-found: warn
          retention-days: 30
