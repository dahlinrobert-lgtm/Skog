name: Test polygon background volume analysis

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/analyze_volume_for_polygon.py"
      - "tests/test_analyze_volume_for_polygon.py"
      - ".github/workflows/test-polygon-volume-analysis.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check numpy rasterio shapely pyproj
      - name: Run polygon input tests
        run: python -m unittest discover -s tests -p 'test_analyze_volume_for_polygon.py' -v
