name: Build Omdrev spatial coverage masks

on:
  workflow_dispatch:
    inputs:
      raster_codes:
        description: Identical tile codes to analyse
        required: true
        default: "12,21,23"
        type: string

permissions:
  contents: read

concurrency:
  group: omdrev-spatial-coverage-masks
  cancel-in-progress: false

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      RASTER_ROUNDS: "1,2,3"
      RASTER_CODES: ${{ inputs.raster_codes || '12,21,23' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install raster analysis dependencies
        run: python -m pip install requests rasterio numpy
      - name: Download matched volume rasters from OneDrive
        env:
          ONEDRIVE_CLIENT_ID: ${{ secrets.ONEDRIVE_CLIENT_ID }}
          ONEDRIVE_REFRESH_TOKEN: ${{ secrets.ONEDRIVE_REFRESH_TOKEN }}
        run: python scripts/download_omdrev_cross_round_pilot.py
      - name: Build 2 km spatial coverage masks
        run: python scripts/build_omdrev_spatial_coverage_masks.py
      - name: Upload spatial coverage masks and summary
        uses: actions/upload-artifact@v4
        with:
          name: omdrev-spatial-coverage-masks
          path: |
            raster-three-omdrev/cross_round_pilot/volume_spatial_coverage_2km.csv
            raster-three-omdrev/cross_round_pilot/volume_spatial_coverage_summary.json
          if-no-files-found: error
          retention-days: 30
