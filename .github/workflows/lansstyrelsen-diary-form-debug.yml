name: Debug Länsstyrelsen diary form

on:
  push:
    paths:
      - "scripts/probe_lansstyrelsen_diary.py"
      - ".github/workflows/lansstyrelsen-diary-form-debug.yml"
  workflow_dispatch:
    inputs:
      county:
        description: County label to inspect
        required: true
        default: "Länsstyrelsen i Västra Götalands län"
        type: string
      search_term:
        description: Search phrase used for context only
        required: true
        default: "naturvårdsbränning"
        type: string

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install requests beautifulsoup4
      - name: Inspect live form
        run: |
          python scripts/probe_lansstyrelsen_diary.py \
            --county "${{ inputs.county }}" \
            --search-term "${{ inputs.search_term }}" \
            --output diary-probe.json
      - name: Upload form diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: lansstyrelsen-diary-form-debug
          path: diary-probe.json
          if-no-files-found: error
          retention-days: 30
