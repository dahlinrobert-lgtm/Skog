name: Map radius filter
on:
  push:
    branches: [fix/clip-polygons-to-radius]
    paths:
      - "docs/karta.html"
      - "docs/map-radius-filter.mjs"
      - "tests/map-radius-filter.test.mjs"
      - ".github/workflows/map-radius-filter.yml"
  pull_request:
    branches: [main]
    paths:
      - "docs/karta.html"
      - "docs/map-radius-filter.mjs"
      - "tests/map-radius-filter.test.mjs"
      - ".github/workflows/map-radius-filter.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  radius-filter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Test radius filter for points, lines, polygons and geometry collections
        run: node --test tests/map-radius-filter.test.mjs
      - name: Syntax-check shared radius filter
        run: node --check docs/map-radius-filter.mjs
      - name: Verify map uses the shared radius filter for all layers
        run: |
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const html = readFileSync("docs/karta.html", "utf8");
            if (!html.includes("<script type=\"module\">")) throw new Error("Map inline script must be a module to import the shared filter");
            if (!html.includes("filterFeatureCollectionToRadius, clipPolygonCollectionToRadius } from \"./map-radius-filter.mjs\";")) throw new Error("Map must import radius filter and polygon clipper from published docs asset");
            if (!html.includes("planned=filterToRadius(planned);performed=filterToRadius(performed);")) throw new Error("Filtered planned and performed collections must be assigned before rendering");
            if (!html.includes("if(wantSamrad){samradPoints=filterToRadius(samradPoints);samradLines=filterToRadius(samradLines);samradAreas=filterToRadius(samradAreas);}")) throw new Error("Filtered consultation collections must be assigned before rendering");
            if (!html.includes("if(wantSamrad)samradAreas=clipPolygonCollection(samradAreas);")) throw new Error("Consultation polygons must be clipped to the circle before rendering");
            if (!html.includes("planned=clipPolygonCollection(planned);performed=clipPolygonCollection(performed);")) throw new Error("Harvest polygons must be clipped to the circle before rendering");
            console.log("Map uses shared radius filter for planned, performed and consultation layers.");
          '
