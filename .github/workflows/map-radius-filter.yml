name: Map radius filter
on:
  push:
    branches: [fix/samrad-radius-filter]
    paths:
      - "docs/karta.html"
      - "docs/map-radius-filter.mjs"
      - "tests/map-radius-filter.test.mjs"
      - ".github/workflows/map-radius-filter.yml"
  pull_request:
    branches: [main]
    paths:
      - "docs/karta.html"
      - "docs/map-radius-filter.mjs"
      - "tests/map-radius-filter.test.mjs"
      - ".github/workflows/map-radius-filter.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  radius-filter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Test radius filter for points, lines, polygons and geometry collections
        run: node --test tests/map-radius-filter.test.mjs
      - name: Syntax-check shared radius filter
        run: node --check docs/map-radius-filter.mjs
      - name: Verify map uses the shared radius filter for all layers
        run: |
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const html = readFileSync("docs/karta.html", "utf8");
            if (!html.includes("<script type=\"module\">")) throw new Error("Map inline script must be a module to import the shared filter");
            if (!html.includes("import { filterFeatureCollectionToRadius } from \"./map-radius-filter.mjs\";")) throw new Error("Map must import shared radius filter from published docs asset");
            if (!/planned=filterToRadius\\(planned\\);\\s*performed=filterToRadius\\(performed\\);/.test(html)) throw new Error("Filtered planned and performed collections must be assigned before rendering");
            if (!/if\\(wantSamrad\\)\\{samradPoints=filterToRadius\\(samradPoints\\);samradLines=filterToRadius\\(samradLines\\);samradAreas=filterToRadius\\(samradAreas\\);\\}/.test(html)) throw new Error("Filtered consultation collections must be assigned before rendering");
            console.log("Map uses shared radius filter for planned, performed and consultation layers.");
          '
