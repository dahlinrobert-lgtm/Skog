name: Map radius filter
on:
  push:
    branches: [fix/clip-polygons-to-radius]
    paths:
      - "docs/karta.html"
      - "docs/map-radius-filter.mjs"
      - "tests/map-radius-filter.test.mjs"
      - ".github/workflows/map-radius-filter.yml"
  pull_request:
    branches: [main]
    paths:
      - "docs/karta.html"
      - "docs/map-radius-filter.mjs"
      - "tests/map-radius-filter.test.mjs"
      - ".github/workflows/map-radius-filter.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  radius-filter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Test radius filter for points, lines, polygons and geometry collections
        run: node --test tests/map-radius-filter.test.mjs
      - name: Syntax-check shared radius filter
        run: node --check docs/map-radius-filter.mjs
      - name: Verify map uses the shared radius filter for all layers
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const html = readFileSync("docs/karta.html", "utf8");
          const assert = (condition, message) => {
            if (!condition) throw new Error(message);
          };
          assert(html.includes('<script type="module">'), "Map inline script must be a module to import the shared filter");
          assert(html.includes('filterFeatureCollectionToRadius, clipPolygonCollectionToRadius } from "./map-radius-filter.mjs";'), "Map must import radius filter and polygon clipper from published docs asset");
          assert(html.includes("planned=filterToRadius(planned);performed=filterToRadius(performed);"), "Filtered planned and performed collections must be assigned before rendering");
          assert(/if\s*\(wantSamrad\)\s*\{[\s\S]*?samradPoints=filterToRadius\(samradPoints\);[\s\S]*?samradLines=filterToRadius\(samradLines\);[\s\S]*?samradAreas=filterToRadius\(samradAreas\);/.test(html), "Filtered consultation collections must be assigned before rendering");
          assert(html.includes('await import("https://cdn.jsdelivr.net/npm/@turf/turf@7.2.0/+esm")'), "Polygon clipping library must load dynamically");
          assert(html.includes("planned=clipPolygonCollection(planned,turf);performed=clipPolygonCollection(performed,turf);"), "Harvest polygons must be clipped to the circle before rendering");
          assert(/if\s*\(turf\)\s*\{\s*try\s*\{\s*samradAreas=clipPolygonCollection\(samradAreas,turf\);/.test(html), "Consultation polygons must be clipped to the circle before rendering when clipping is available");
          assert(html.includes("catch(clipError)"), "Clipping-library failures must be caught so map startup can recover");
          console.log("Map uses shared radius filter for planned, performed and consultation layers.");
          NODE
