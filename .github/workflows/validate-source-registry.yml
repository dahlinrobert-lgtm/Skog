name: Validate source registry

on:
  push:
    paths:
      - "data-platform/config/sources.yml"
      - "data-platform/scripts/validate_source_registry.py"
      - "data-platform/scripts/build_source_status_report.py"
      - ".github/workflows/validate-source-registry.yml"
  pull_request:
    paths:
      - "data-platform/config/sources.yml"
      - "data-platform/scripts/validate_source_registry.py"
      - "data-platform/scripts/build_source_status_report.py"
      - ".github/workflows/validate-source-registry.yml"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install YAML parser
        run: python -m pip install "PyYAML==6.0.2"

      - name: Validate source registry
        run: python data-platform/scripts/validate_source_registry.py

      - name: Build source status report
        run: python data-platform/scripts/build_source_status_report.py --write

      - name: Upload generated source status report
        uses: actions/upload-artifact@v4
        with:
          name: skogskoll-source-status-report
          path: docs/SKOGSKOLL_SOURCE_STATUS.md
          if-no-files-found: error

      - name: Create or update report pull request
        if: github.event_name == 'push'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/source-status-report
          base: main
          delete-branch: true
          add-paths: docs/SKOGSKOLL_SOURCE_STATUS.md
          commit-message: "chore: refresh Skogskoll source status report"
          title: "chore: refresh Skogskoll source status report"
          body: |
            Automated refresh of the generated source status report.
            Please review the report and merge if it reflects the current registry.
          labels: automated, documentation
