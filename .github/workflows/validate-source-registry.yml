name: Validate source registry

on:
  push:
    paths:
      - "data-platform/config/sources.yml"
      - "data-platform/scripts/validate_source_registry.py"
      - "data-platform/scripts/build_source_status_report.py"
      - ".github/workflows/validate-source-registry.yml"
  pull_request:
    paths:
      - "data-platform/config/sources.yml"
      - "data-platform/scripts/validate_source_registry.py"
      - "data-platform/scripts/build_source_status_report.py"
      - ".github/workflows/validate-source-registry.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install YAML parser
        run: python -m pip install "PyYAML==6.0.2"

      - name: Validate source registry
        run: python data-platform/scripts/validate_source_registry.py

      - name: Build source status report
        run: python data-platform/scripts/build_source_status_report.py --write

      - name: Upload generated source status report
        uses: actions/upload-artifact@v4
        with:
          name: skogskoll-source-status-report
          path: docs/SKOGSKOLL_SOURCE_STATUS.md
          if-no-files-found: error

      - name: Commit refreshed report
        if: github.event_name == 'push'
        run: |
          if git diff --quiet -- docs/SKOGSKOLL_SOURCE_STATUS.md; then
            echo "Source status report is already current."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/SKOGSKOLL_SOURCE_STATUS.md
            git commit -m "chore: refresh Skogskoll source status report"
            git push
          fi
