name: Skogskoll Supabase read-only connection check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  connection-check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Verify Supabase worker credentials and read-only access
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node skogskoll/scripts/probe-supabase-connection.mjs
