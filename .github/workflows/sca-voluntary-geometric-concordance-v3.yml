name: SCA voluntary geometric concordance audit v3
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/audit_sca_voluntary_geometric_concordance_v3.py"
      - ".github/workflows/sca-voluntary-geometric-concordance-v3.yml"
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install MVT and geometry libraries
        run: python -m pip install "requests>=2.31,<3" "mapbox-vector-tile>=2,<3" "shapely>=2,<3"
      - name: Compile
        run: python -m py_compile scripts/audit_sca_voluntary_geometric_concordance_v3.py
      - name: Run geometric concordance audit
        run: python scripts/audit_sca_voluntary_geometric_concordance_v3.py
      - name: Validate JSON
        run: python -m json.tool sca-voluntary-geometric-concordance-v3.json > /dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: sca-voluntary-geometric-concordance-v3
          path: sca-voluntary-geometric-concordance-v3.json
          if-no-files-found: error
          retention-days: 30
