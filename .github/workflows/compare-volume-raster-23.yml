name: Compare volume raster 23 between omdrev 2 and 3

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compare-volume-raster-23
  cancel-in-progress: false

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install comparison dependencies
        run: python -m pip install requests rasterio numpy
      - name: Download and compare raster 23
        env:
          ONEDRIVE_CLIENT_ID: ${{ secrets.ONEDRIVE_CLIENT_ID }}
          ONEDRIVE_REFRESH_TOKEN: ${{ secrets.ONEDRIVE_REFRESH_TOKEN }}
        run: python scripts/compare_volume_raster_23.py
      - name: Upload comparison report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: volume-raster-23-comparison
          path: raster-comparison/raster23-comparison.json
          if-no-files-found: warn
          retention-days: 30
