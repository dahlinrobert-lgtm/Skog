name: Extract SCA tile grid configuration
on:
  push:
    branches: [investigate/**]
    paths:
      - "scripts/extract_sca_tile_grid_config.py"
      - ".github/workflows/extract-sca-tile-grid-config.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "requests>=2.31,<3"
      - run: python scripts/extract_sca_tile_grid_config.py
      - uses: actions/upload-artifact@v4
        with:
          name: sca-tile-grid-config
          path: sca-tile-grid-config.json
          retention-days: 30
