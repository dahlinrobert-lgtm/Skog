name: Monitor SCA voluntary geometry changes

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * 1"

permissions:
  contents: write
  actions: read

concurrency:
  group: sca-voluntary-change-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install MVT dependencies and test runner
        run: python -m pip install "requests>=2.31,<3" "mapbox-vector-tile>=2,<3" pytest
      - name: Download original national z12 baseline if state does not exist
        if: ${{ !hashFiles('data/sca/monitoring/tile-state.json.gz') }}
        uses: actions/download-artifact@v4
        with:
          pattern: sca-national-voluntary-tile-expansion-z12-batch-*
          run-id: 41704577034
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: input/baseline
      - name: Run monitor regression tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest -q tests/test_monitor_sca_voluntary_tiles.py
      - name: Refresh independent national z9 seed census
        run: |
          python -m py_compile scripts/sca_national_independent_layer_census_z9.py
          python scripts/sca_national_independent_layer_census_z9.py
      - name: Audit sampled z8-z12 tile coverage
        run: |
          python -m py_compile scripts/audit_sca_tile_coverage.py
          python scripts/audit_sca_tile_coverage.py \\
            --census sca-national-independent-layer-census-z9.json \\
            --out output/sca-multizoom-coverage-audit.json \\
            --samples-per-class 8 \\
            --workers 2
      - name: Poll z12 tiles and compare geometry and metadata
        env:
          MAX_WORKERS: "3"
        run: |
          python -m py_compile scripts/monitor_sca_voluntary_tiles.py
          python scripts/monitor_sca_voluntary_tiles.py \
            --state data/sca/monitoring/tile-state.json.gz \
            --baseline-dir input/baseline \
            --seed-census sca-national-independent-layer-census-z9.json \
            --events output/sca-voluntary-change-events.jsonl.gz \
            --summary output/sca-voluntary-change-summary.json \
            --workers 3
      - name: Validate monitor outputs
        run: |
          python -m json.tool output/sca-voluntary-change-summary.json > /dev/null
          python -m json.tool output/sca-multizoom-coverage-audit.json > /dev/null
          python - <<'PY'
          import gzip, json
          from pathlib import Path
          s=json.loads(Path("output/sca-voluntary-change-summary.json").read_text())
          assert s["tiles_checked"] == s["tile_plan_tile_count"]
          assert s["identity_resolved"] == 0
          with gzip.open("output/sca-voluntary-change-events.jsonl.gz", "rt", encoding="utf-8") as f:
              for line in f:
                  event=json.loads(line)
                  required={"event_schema_version","event_id","event_type","event_category","source_system","source_tile","source_url","notification_candidate"}
                  assert required.issubset(event), f"Missing event envelope fields: {required-set(event)}"
                  assert event["event_schema_version"] == 1
                  assert len(event["event_id"]) == 64
          print(json.dumps(s, ensure_ascii=False, indent=2))
          PY
      - name: Persist state and append change event archive
        run: |
          mkdir -p data/sca/monitoring/events
          EVENT_COUNT=$(python -c 'import json; print(json.load(open("output/sca-voluntary-change-summary.json"))["events"])')
          if [ "$EVENT_COUNT" -gt 0 ]; then
            cp output/sca-voluntary-change-events.jsonl.gz "data/sca/monitoring/events/$(date -u +%Y-%m-%d)-${GITHUB_RUN_NUMBER}.jsonl.gz"
          else
            echo "No change events; no empty event archive will be committed."
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sca/monitoring/tile-state.json.gz data/sca/monitoring/baseline/
          if compgen -G "data/sca/monitoring/events/*.jsonl.gz" > /dev/null; then
            git add data/sca/monitoring/events/*.jsonl.gz
          fi
          if ! git diff --cached --quiet; then
            git commit -m "Record SCA voluntary geometry monitoring snapshot"
            # Contents API and other workflows may update main while this scan runs.
            # Retry by rebasing our monitoring commit; never force-push the branch.
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              if git rebase origin/main; then
                if git push origin HEAD:main; then
                  echo "Monitoring state persisted successfully."
                  break
                fi
              fi
              git rebase --abort || true
              if [ "$attempt" -eq 5 ]; then
                echo "Could not persist monitoring state after five safe retries." >&2
                exit 1
              fi
              sleep $((attempt * 5))
            done
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: sca-voluntary-change-monitor
          path: |
            output/sca-voluntary-change-summary.json
            output/sca-voluntary-change-events.jsonl.gz
            sca-national-independent-layer-census-z9.json
            output/sca-multizoom-coverage-audit.json
          if-no-files-found: error
          retention-days: 90
