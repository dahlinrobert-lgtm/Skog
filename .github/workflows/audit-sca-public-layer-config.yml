name: Audit SCA public layer configuration

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/audit_sca_public_layer_config.py"
      - ".github/workflows/audit-sca-public-layer-config.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install requests
        run: python -m pip install "requests>=2.31,<3"
      - name: Audit public layer configuration and online URL clues
        run: python scripts/audit_sca_public_layer_config.py
      - name: Upload audit
        uses: actions/upload-artifact@v4
        with:
          name: sca-public-layer-config-audit
          path: sca-public-layer-config-audit.json
          if-no-files-found: error
          retention-days: 30
