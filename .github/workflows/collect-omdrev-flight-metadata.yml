name: Collect Omdrev laser scan metadata

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: collect-omdrev-laser-metadata
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install requests
      - name: Fetch Skogsstyrelsen scan metadata for raster extents
        run: python scripts/collect_omdrev_flight_metadata.py
      - name: Upload metadata tables and geometry
        uses: actions/upload-artifact@v4
        with:
          name: omdrev-laser-scan-metadata
          path: raster-three-omdrev/flight_metadata/
          if-no-files-found: error
          retention-days: 30
