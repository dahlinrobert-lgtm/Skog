name: Collect Omdrev laser scan metadata

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/collect-omdrev-flight-metadata.yml"
      - "scripts/collect_omdrev_flight_metadata.py"
      - "scripts/join_omdrev_metadata_to_volume_rasters.py"
      - "scripts/download_rasters_from_onedrive.py"

permissions:
  contents: read

concurrency:
  group: collect-omdrev-laser-metadata
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      RASTER_CODES: "12,21,23"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install requests rasterio numpy
      - name: Download selected volume rasters from personal OneDrive
        env:
          ONEDRIVE_CLIENT_ID: ${{ secrets.ONEDRIVE_CLIENT_ID }}
          ONEDRIVE_REFRESH_TOKEN: ${{ secrets.ONEDRIVE_REFRESH_TOKEN }}
        run: python scripts/download_rasters_from_onedrive.py
      - name: Fetch scan metadata for the actual raster extents
        run: python scripts/collect_omdrev_flight_metadata.py
      - name: Join scan metadata to valid Omdrev 3 raster pixels
        run: python scripts/join_omdrev_metadata_to_volume_rasters.py
      - name: Upload metadata tables, raster join, and source geometries
        uses: actions/upload-artifact@v4
        with:
          name: omdrev-laser-scan-metadata
          path: raster-three-omdrev/flight_metadata/
          if-no-files-found: error
          retention-days: 30
