name: Diagnose SCA voluntary high-zoom tile availability
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/diagnose_sca_voluntary_zoom_availability.py"
      - ".github/workflows/diagnose-sca-voluntary-zoom-availability.yml"
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install MVT decoder
        run: python -m pip install "requests>=2.31,<3" "mapbox-vector-tile>=2,<3"
      - name: Test bounded neighbor tiles
        run: python scripts/diagnose_sca_voluntary_zoom_availability.py
      - name: Validate JSON
        run: python -m json.tool sca-voluntary-zoom-availability.json > /dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: sca-voluntary-zoom-availability
          path: sca-voluntary-zoom-availability.json
          if-no-files-found: error
          retention-days: 30
