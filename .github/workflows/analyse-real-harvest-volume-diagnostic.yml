name: Diagnose real harvest volume analysis

on:
  workflow_dispatch:
    inputs:
      sample_limit:
        description: Polygon sample per raster; 50,000 is the next scale-up test
        required: true
        default: "50000"
        type: string
      raster_codes:
        description: Raster areas to test (07, 10, 12, 13, 21, 23; selected ZIPs must be committed)
        required: true
        default: "13"
        type: string
  push:
    paths:
      - "scripts/analyze_volume_for_polygon.py"
      - "scripts/split_real_harvest_volume_groups.py"
      - "scripts/fetch_real_harvests_for_volume_rasters.py"
      - ".github/workflows/analyse-real-harvest-volume-diagnostic.yml"

permissions:
  contents: read

concurrency:
  group: real-harvest-volume-diagnostic
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install analysis dependencies
        run: python -m pip install requests numpy rasterio shapely pyproj
      - name: Fetch a bounded polygon sample
        env:
          LIMIT_INPUT: ${{ inputs.sample_limit }}
          CODES_INPUT: ${{ inputs.raster_codes }}
        run: |
          limit="${LIMIT_INPUT:-50000}"
          codes="${CODES_INPUT:-13}"
          python scripts/fetch_real_harvests_for_volume_rasters.py \
            --output real-volume-polygons.geojson \
            --limit "$limit" \
            --raster-codes "$codes"
      - name: Split groups and analyse sample with diagnostics
        env:
          CODES_INPUT: ${{ inputs.raster_codes }}
        run: |
          set +e
          codes="${CODES_INPUT:-13}"
          python scripts/split_real_harvest_volume_groups.py \
            --input real-volume-polygons.geojson \
            --raster-codes "$codes"
          split_status=$?
          if [ "$split_status" -ne 0 ]; then
            echo "GROUP_SPLIT_EXIT_CODE=$split_status"
            exit "$split_status"
          fi

          status=0
          for code in $(echo "$codes" | tr ',' ' '); do
            if [ ! -f "real-polygons-$code.geojson" ]; then
              echo "Missing prepared polygon file: real-polygons-$code.geojson" >&2
              status=1
              continue
            fi
            mkdir -p "raster-data-$code"
            if [ ! -f "data/skogliga-grunddata/sks_Volym_omdrev3_$code.zip" ]; then
              echo "Missing committed raster archive for code $code" >&2
              status=1
              continue
            fi
            cp "data/skogliga-grunddata/sks_Volym_omdrev3_$code.zip" "raster-data-$code/"
            python scripts/analyze_volume_for_polygon.py \
              --polygon "real-polygons-$code.geojson" \
              --data-dir "raster-data-$code" \
              --output "real-volume-report-$code.json"
            analysis_status=$?
            if [ "$analysis_status" -ne 0 ]; then status=$analysis_status; fi
            if [ -f "real-volume-report-$code.json" ]; then
              python - "$code" <<'PYREPORT'
          import json, sys
          from pathlib import Path
          code=sys.argv[1]
          report=json.loads(Path(f"real-volume-report-{code}.json").read_text(encoding="utf-8"))
          print(f"REPORT raster={code} polygons={report.get('polygon_count')} rasters={len(report.get('rasters', []))} errors={len(report.get('errors', []))}", flush=True)
          for error in report.get("errors", [])[:5]:
              print("REPORT_ERROR", json.dumps(error, ensure_ascii=False)[:5000], flush=True)
          PYREPORT
            else
              echo "No report JSON produced for raster $code"
            fi
          done
          echo "ANALYSIS_EXIT_CODE=$status"
          exit "$status"
      - name: Upload diagnostic input, reports and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-harvest-volume-diagnostic
          path: |
            real-volume-polygons.geojson
            real-polygons-*.geojson
            real-volume-report-*.json
            scripts/split_real_harvest_volume_groups.py
          if-no-files-found: warn
          retention-days: 14
