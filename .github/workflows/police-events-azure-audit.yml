name: Police Azure archive audit

on:
  workflow_dispatch:
    inputs:
      deep:
        description: "Download, decompress and SHA-256 verify every archived segment"
        required: false
        type: boolean
        default: false
  schedule:
    - cron: "23 5 1 * *"

permissions:
  contents: read
  id-token: write

concurrency:
  group: skog-police-azure-archive-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Sign in to Azure with GitHub OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Audit archive inventory and manifests
        env:
          AZURE_STORAGE_ACCOUNT: stskogkolldata
          POLICE_ARCHIVE_CONTAINER: police-events
          DEEP_AUDIT: ${{ inputs.deep }}
        run: |
          if [ "$DEEP_AUDIT" = "true" ]; then
            python scripts/audit_police_events_blob_archive.py --deep
          else
            python scripts/audit_police_events_blob_archive.py
          fi
