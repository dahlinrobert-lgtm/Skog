name: Analyse Omdrev volume pixels across rounds

on:
  workflow_dispatch:
    inputs:
      raster_codes:
        description: Identical tile codes to analyse
        required: true
        default: "12,21,23"
        type: string

permissions:
  contents: read

concurrency:
  group: omdrev-volume-pixel-statistics
  cancel-in-progress: false

jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      RASTER_ROUNDS: "1,2,3"
      RASTER_CODES: ${{ inputs.raster_codes || '12,21,23' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install raster analysis dependencies
        run: python -m pip install requests rasterio numpy
      - name: Download matched volume rasters from OneDrive
        env:
          ONEDRIVE_CLIENT_ID: ${{ secrets.ONEDRIVE_CLIENT_ID }}
          ONEDRIVE_REFRESH_TOKEN: ${{ secrets.ONEDRIVE_REFRESH_TOKEN }}
        run: python scripts/download_omdrev_cross_round_pilot.py
      - name: Calculate per-raster statistics and Omdrev 2-3 pixel differences
        run: python scripts/analyse_omdrev_volume_pixels.py
      - name: Upload pixel statistics
        uses: actions/upload-artifact@v4
        with:
          name: omdrev-volume-pixel-statistics
          path: raster-three-omdrev/cross_round_pilot/volume_pixel_statistics.json
          if-no-files-found: error
          retention-days: 30
