name: Poll Skogsstyrelsen laser-scan metadata changes

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: skogsstyrelsen-scan-metadata-poll
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install API client
        run: python -m pip install requests
      - name: Check national scan metadata and archive only changes
        id: poll
        run: |
          set -euo pipefail
          python scripts/poll_skogsstyrelsen_scan_metadata.py | tee poll-result.json
          if grep -q '"status": "unchanged"' poll-result.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Create or update metadata snapshot pull request
        if: steps.poll.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ github.token }}
          branch: automation/skogsstyrelsen-laser-scan-metadata-snapshots
          base: main
          delete-branch: true
          add-paths: |
            data/skogsstyrelsen/laser_scan_metadata/
          commit-message: "Archive changed Skogsstyrelsen laser-scan metadata"
          title: "data: archive Skogsstyrelsen laser-scan metadata snapshot"
          body: |
            Automated complete metadata snapshot from Skogsstyrelsen's national
            laser-scan metadata layer.

            Review the feature count, content SHA-256, dated gzip snapshot and
            latest.json before merging. The first complete observation is a quiet
            baseline and must not generate historical alerts. Later differences
            represent observed source-content changes, not source publication
            timestamps or proof of a specific real-world event.

            The collector refuses to write a snapshot when ID inventory or feature
            retrieval is incomplete. This PR does not authorize commercial use,
            customer display or redistribution.
