name: Poll Skogsstyrelsen laser-scan metadata changes

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: skogsstyrelsen-scan-metadata-poll
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install API client
        run: python -m pip install requests
      - name: Check national scan metadata and archive only changes
        id: poll
        run: |
          python scripts/poll_skogsstyrelsen_scan_metadata.py | tee poll-result.json
          if grep -q '"status": "unchanged"' poll-result.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Commit new source snapshot
        if: steps.poll.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/skogsstyrelsen/laser_scan_metadata/
          git commit -m "Archive changed Skogsstyrelsen scan metadata"
          git push origin main
