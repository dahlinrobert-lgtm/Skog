name: Life2Taiga naturvårdsåtgärder

on:
  pull_request:
    paths:
      - "scripts/lifetaiga_fetch_naturvardsatgarder.py"
      - "scripts/test_lifetaiga_fetch_naturvardsatgarder.py"
      - "docs/karta.html"
      - ".github/workflows/lifetaiga-naturvardsatgarder.yml"
  workflow_dispatch:
  schedule:
    - cron: "25 6 * * *"
  push:
    branches: [main, feature/lifetaiga-burnings-layer]
    paths:
      - "scripts/lifetaiga_fetch_naturvardsatgarder.py"
      - "scripts/test_lifetaiga_fetch_naturvardsatgarder.py"
      - ".github/workflows/lifetaiga-naturvardsatgarder.yml"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: lifetaiga-naturvardsatgarder-publish
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test collector
        run: python -m unittest discover -s scripts -p 'test_lifetaiga_fetch_naturvardsatgarder.py' -v
      - name: Fetch official Life2Taiga polygons
        run: python scripts/lifetaiga_fetch_naturvardsatgarder.py
      - name: Validate published dataset
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path("docs/data/lifetaiga-naturvardsatgarder.geojson")
          data = json.loads(path.read_text(encoding="utf-8"))
          if data.get("type") != "FeatureCollection" or not data.get("features"):
              raise SystemExit("Life2Taiga output is not a non-empty FeatureCollection")
          if data.get("feature_count") != len(data["features"]):
              raise SystemExit("Life2Taiga feature_count does not match features")
          print(f"Validated {len(data['features'])} source features from {data.get('source_layer_name')}")
          PY
      - name: Create or update Life2Taiga data pull request
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ github.token }}
          branch: automation/lifetaiga-naturvardsatgarder-data
          delete-branch: true
          add-paths: |
            docs/data/lifetaiga-naturvardsatgarder.geojson
          commit-message: "Publish updated Life2Taiga action polygons"
          title: "data: update Life2Taiga nature restoration polygons"
          body: |
            ## Life2Taiga source-data update

            This PR contains the validated official polygon dataset fetched by the scheduled collector.

            - Collector tests passed before collection.
            - The output was validated as a non-empty GeoJSON FeatureCollection.
            - Feature count and source layer are recorded in the workflow log.

            Review the dataset and run log before merging. This PR does not change source licensing decisions or authorize customer display.
