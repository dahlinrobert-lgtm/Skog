name: Länsstyrelsen diary geocoding pilot

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/lansstyrelsen_diary_geocoding.py"
      - "scripts/test_lansstyrelsen_diary_geocoding.py"
      - "data/lansstyrelsen-diary/state.json"
      - ".github/workflows/lansstyrelsen-diary-geocoding-pilot.yml"

permissions:
  contents: read

jobs:
  extract-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run clue extraction tests
        run: python scripts/test_lansstyrelsen_diary_geocoding.py
      - name: Generate geocoding candidate report
        run: python scripts/lansstyrelsen_diary_geocoding.py
      - name: Upload candidate report
        uses: actions/upload-artifact@v4
        with:
          name: lansstyrelsen-diary-geocoding-candidates
          path: data/lansstyrelsen-diary/geocoding-candidates.json
          if-no-files-found: error
