name: Länsstyrelsen diary geocoding integration

on:
  pull_request:
    paths:
      - "scripts/lansstyrelsen_diary_geocoding.py"
      - "scripts/lansstyrelsen_diary_fetch_protected_areas.py"
      - "scripts/lansstyrelsen_diary_protected_area_match.py"
      - "scripts/lansstyrelsen_diary_web_export.py"
      - "scripts/test_lansstyrelsen_diary_web_export.py"
      - "data/lansstyrelsen-diary/state.json"
      - "docs/karta.html"
      - ".github/workflows/lansstyrelsen-diary-geocoding-integration.yml"
  push:
    branches: [main, feature/diary-geocoding-map-layer]
    paths:
      - "scripts/lansstyrelsen_diary_geocoding.py"
      - "scripts/lansstyrelsen_diary_fetch_protected_areas.py"
      - "scripts/lansstyrelsen_diary_protected_area_match.py"
      - "scripts/lansstyrelsen_diary_web_export.py"
      - "scripts/test_lansstyrelsen_diary_web_export.py"
      - "data/lansstyrelsen-diary/state.json"
      - "docs/karta.html"
      - ".github/workflows/lansstyrelsen-diary-geocoding-integration.yml"
  workflow_dispatch:
  schedule:
    - cron: "45 6 * * *"

permissions:
  contents: write

jobs:
  geocode:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install geospatial dependencies
        run: python -m pip install "shapely>=2.0,<3" "pyproj>=3.6,<4" "pyshp>=2.3,<3"
      - name: Extract geography clues from current diary history
        run: python scripts/lansstyrelsen_diary_geocoding.py
      - name: Download official protected area polygons
        run: python scripts/lansstyrelsen_diary_fetch_protected_areas.py
      - name: Match candidates against official areas
        run: python scripts/lansstyrelsen_diary_protected_area_match.py --official-geojson data/lansstyrelsen-diary/official-protected-areas.geojson
      - name: Test map export
        run: python -m unittest discover -s scripts -p 'test_lansstyrelsen_diary_web_export.py' -v
      - name: Export stable public map data
        run: python scripts/lansstyrelsen_diary_web_export.py --output docs/data/lansstyrelsen-geocoding.json
      - name: Summarize generated report
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("data/lansstyrelsen-diary/geocoding-matches.json").read_text(encoding="utf-8"))
          public = json.loads(Path("docs/data/lansstyrelsen-geocoding.json").read_text(encoding="utf-8"))
          print(json.dumps({
              "record_count": report["record_count"],
              "official_feature_count": report["official_feature_count"],
              "summary": report["summary"],
              "public_map_location_count": public["map_location_count"],
          }, ensure_ascii=False, indent=2))
          if report["record_count"] == 0:
              raise SystemExit("No diary records were processed")
          if report["official_feature_count"] == 0:
              raise SystemExit("No official protected areas were downloaded")
          PY
      - name: Publish map data to main
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/lansstyrelsen-geocoding.json
          if ! git diff --cached --quiet; then
            git commit -m "Publish updated diary geocoding map data"
            git push origin HEAD:main
          else
            echo "Published geocoding data unchanged."
          fi
      - name: Upload geocoding review artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lansstyrelsen-diary-geocoding-review
          path: |
            data/lansstyrelsen-diary/geocoding-candidates.json
            data/lansstyrelsen-diary/geocoding-matches.json
            docs/data/lansstyrelsen-geocoding.json
          if-no-files-found: error
          retention-days: 30
