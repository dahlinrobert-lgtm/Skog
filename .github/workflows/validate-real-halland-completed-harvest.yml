name: Validate real Halland completed-harvest polygons

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/fetch_halland_completed_sample.py"
      - "scripts/compare_polygon_pixel_methods.py"
      - "scripts/audit_raster_polygon_ownership.py"
      - "scripts/analyze_polygon_pair_overlaps.py"
      - "tests/test_compare_polygon_pixel_methods.py"
      - "tests/test_uniform_control_raster.py"
      - ".github/workflows/validate-real-halland-completed-harvest.yml"

permissions:
  contents: read

jobs:
  validate-real-polygons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install analysis dependencies
        run: python -m pip install requests numpy rasterio shapely pyproj
      - name: Fetch real completed-harvest polygons from Skogsstyrelsen
        run: |
          python scripts/fetch_halland_completed_sample.py \
            --limit 500 \
            --output halland-completed-harvest-sample.geojson
      - name: Test pixel comparison helper
        run: |
          python -m unittest tests/test_compare_polygon_pixel_methods.py
          python -m unittest tests/test_uniform_control_raster.py
      - name: Compare cell-centre and fractional coverage
        run: |
          python scripts/compare_polygon_pixel_methods.py \
            --polygon halland-completed-harvest-sample.geojson \
            --polygon-crs EPSG:3006 \
            --raster data/skogliga-grunddata/sks_Volym_omdrev3_13.zip \
            --output real-halland-pixel-comparison.json
      - name: Audit cell ownership
        run: |
          python scripts/audit_raster_polygon_ownership.py \
            --polygon halland-completed-harvest-sample.geojson \
            --polygon-crs EPSG:3006 \
            --raster data/skogliga-grunddata/sks_Volym_omdrev3_13.zip \
            --output real-halland-cell-ownership.json
      - name: Analyze polygon-pair geometric overlaps
        run: |
          python scripts/analyze_polygon_pair_overlaps.py \
            --polygon halland-completed-harvest-sample.geojson \
            --polygon-crs EPSG:3006 \
            --raster data/skogliga-grunddata/sks_Volym_omdrev3_13.zip \
            --output real-halland-polygon-pair-overlaps.json
      - name: Validate real-polygon report
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          sample = json.loads(Path("halland-completed-harvest-sample.geojson").read_text(encoding="utf-8"))
          comparison = json.loads(Path("real-halland-pixel-comparison.json").read_text(encoding="utf-8"))
          ownership = json.loads(Path("real-halland-cell-ownership.json").read_text(encoding="utf-8"))
          pair_overlaps = json.loads(Path("real-halland-polygon-pair-overlaps.json").read_text(encoding="utf-8"))
          assert sample["features"], "No real source features"
          assert len(comparison["polygons"]) == len(sample["features"])
          assert ownership["polygon_count"] == len(sample["features"])
          assert pair_overlaps["polygon_count"] == len(sample["features"])
          assert pair_overlaps["pairs_with_shared_cell_centres"] >= 0
          from collections import Counter
          statuses = Counter(p["comparison"]["status"] for p in comparison["polygons"])
          ok = statuses.get("ok", 0)
          print("Source polygons:", len(sample["features"]))
          print("Raster coverage status counts:", dict(statuses))
          print("Cell overlap:", ownership["cells_selected_by_multiple_polygons"])
          print("Double-count excess:", ownership["double_count_excess"])
          print("Polygon pairs with shared cell centres:", pair_overlaps["pairs_with_shared_cell_centres"])
          print("Pairs with positive geometric area overlap:", pair_overlaps["pairs_with_positive_area_overlap"])
          print("Pairs touching only or numerical sliver:", pair_overlaps["pairs_touching_only_or_numerical_sliver"])
          print("Overlap cell details:")
          for cell in ownership.get("overlap_cell_details", []):
              print("Overlap cell", cell["row"], cell["column"],
                    "owners=", ",".join(map(str, cell["feature_ids"])),
                    "centre=", cell["center_x"], cell["center_y"])
          valid = [p["comparison"] for p in comparison["polygons"] if p["comparison"]["status"] == "ok"]
          if valid:
              diffs = [p["volume_difference_fractional_minus_center_m3sk"] for p in valid]
              abs_diffs = [abs(x) for x in diffs]
              print("Valid polygons compared:", len(valid))
              print("Mean signed volume difference (m3sk):", round(sum(diffs) / len(diffs), 3))
              print("Mean absolute volume difference (m3sk):", round(sum(abs_diffs) / len(abs_diffs), 3))
              print("Maximum absolute volume difference (m3sk):", round(max(abs_diffs), 3))
          for item in comparison["polygons"]:
              c = item["comparison"]
              print("Polygon", item["feature_id"], "status=", c["status"],
                    "area_ha=", c.get("polygon_area_ha"),
                    "centre_cells=", c.get("valid_center_cells"),
                    "fractional_cells=", c.get("fractional_intersecting_cells"),
                    "fractional_coverage_ha=", c.get("fractional_coverage_ha"))
          assert ok > 0, "No sample polygon has valid raster coverage; check source/raster alignment"
          PY
      - name: Upload reproducible sample and reports
        uses: actions/upload-artifact@v4
        with:
          name: real-halland-completed-harvest-validation
          path: |
            halland-completed-harvest-sample.geojson
            real-halland-pixel-comparison.json
            real-halland-cell-ownership.json
            real-halland-polygon-pair-overlaps.json
          if-no-files-found: error
