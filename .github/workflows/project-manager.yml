name: Skogskoll AI project manager

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/project_manager_agent.py"
      - "scripts/project_manager_history.py"
      - "tests/test_project_manager_agent.py"
      - "tests/test_project_manager_history.py"
      - ".github/workflows/project-manager.yml"
  push:
    branches: [main]
    paths:
      - "scripts/project_manager_agent.py"
      - "tests/test_project_manager_agent.py"
      - ".github/workflows/project-manager.yml"

permissions:
  contents: read
  issues: read
  pull-requests: read
  actions: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run project manager tests
        run: |
          python -m unittest discover -s tests -p "test_project_manager_agent.py" -v
          python -m unittest discover -s tests -p "test_project_manager_history.py" -v

  inventory:
    if: github.event_name == 'workflow_dispatch'
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect read-only GitHub inventory
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/project_manager_agent.py --output-dir project-manager-output
      - name: Upload project manager report
        uses: actions/upload-artifact@v4
        with:
          name: skogskoll-project-manager-report
          path: project-manager-output/
          if-no-files-found: error
          retention-days: 14
