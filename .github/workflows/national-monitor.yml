name: Nationwide planned harvest archive
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/monitor_national.py"
      - "tests/test_monitor_national.py"
      - ".github/workflows/national-monitor.yml"
  pull_request:
    paths:
      - "scripts/monitor_national.py"
      - "tests/test_monitor_national.py"
      - ".github/workflows/national-monitor.yml"
  schedule:
    - cron: "47 5 1,16 * *"
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: national-planned-harvest-archive
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Test national archive and collection safeguards
        run: python -m unittest discover -s tests -p 'test_monitor_national.py' -v

  archive:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Fetch all planned notifications nationwide
        run: python scripts/monitor_national.py
      - name: Create or update archive pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/national-planned-harvest-archive
          delete-branch: true
          add-paths: |
            data/national/latest.json.gz
            data/national/snapshots
          commit-message: "Update nationwide planned harvest archive"
          title: "data: update nationwide planned harvest archive"
          body: |
            Automated nationwide planned-harvest archive update.
            Review the complete-scan diagnostics and archive delta before merging.
            Failed or unstable scans do not publish changes and must not be interpreted as removals.
          labels: automated, data
