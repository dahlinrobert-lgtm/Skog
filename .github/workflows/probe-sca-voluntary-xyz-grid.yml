name: Probe SCA voluntary set-aside XYZ grid
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/probe_sca_voluntary_xyz_grid.py"
      - ".github/workflows/probe-sca-voluntary-xyz-grid.yml"
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install MVT decoder
        run: python -m pip install "requests>=2.31,<3" "mapbox-vector-tile>=2,<3"
      - name: Probe bounded XYZ tiles
        run: python scripts/probe_sca_voluntary_xyz_grid.py
      - name: Validate report
        run: python -m json.tool sca-voluntary-xyz-grid-probe.json > /dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: sca-voluntary-xyz-grid-probe
          path: sca-voluntary-xyz-grid-probe.json
          if-no-files-found: error
          retention-days: 30
