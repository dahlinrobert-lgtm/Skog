name: Skogskoll geometry converter tests

on:
  pull_request:
    paths:
      - "skogskoll/tools/convert-min-karta-geometry.py"
      - "skogskoll/tools/test_convert_min_karta_geometry.py"
      - "skogskoll/tools/README-geometry-converter.md"
      - ".github/workflows/skogskoll-geometry-tests.yml"
  push:
    branches:
      - main
    paths:
      - "skogskoll/tools/convert-min-karta-geometry.py"
      - "skogskoll/tools/test_convert_min_karta_geometry.py"
      - "skogskoll/tools/README-geometry-converter.md"
      - ".github/workflows/skogskoll-geometry-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  geometry-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install converter dependency
        run: python -m pip install --upgrade pip pyproj
      - name: Run geometry converter unit tests
        working-directory: skogskoll/tools
        run: python -m unittest -v test_convert_min_karta_geometry.py
