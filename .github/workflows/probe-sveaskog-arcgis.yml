name: Probe Sveaskog ArcGIS map

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/probe_sveaskog_arcgis.py"
      - ".github/workflows/probe-sveaskog-arcgis.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependency
        run: python -m pip install --upgrade pip requests
      - name: Inspect public ArcGIS items and service metadata
        id: probe
        continue-on-error: true
        run: python scripts/probe_sveaskog_arcgis.py
      - name: Upload discovery report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sveaskog-arcgis-discovery-report
          path: artifacts/sveaskog-arcgis-probe.json
          if-no-files-found: warn
          retention-days: 30
