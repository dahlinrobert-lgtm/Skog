name: Probe Sveaskog feature-layer queries

on:
  workflow_dispatch:
  push:
    branches:
      - "investigate/**"
    paths:
      - "scripts/probe_sveaskog_layer_queries.py"
      - ".github/workflows/probe-sveaskog-layer-queries.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependency
        run: python -m pip install --upgrade pip requests
      - name: Inspect sublayer metadata and bounded queries
        run: python scripts/probe_sveaskog_layer_queries.py
      - name: Upload query probe report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sveaskog-layer-query-report
          path: artifacts/sveaskog-layer-query-probe.json
          if-no-files-found: warn
          retention-days: 30
