name: Police–NVR matching and geographic evidence tests

on:
  pull_request:
    paths:
      - 'scripts/build_lulea_police_review.py'
      - 'scripts/enrich_police_nvr_geography.py'
      - 'scripts/extract_police_wildlife_incidents.py'
      - 'scripts/match_police_nvr_temporal.py'
      - 'scripts/inspect_ortnamn_geopackage.py'
      - 'scripts/inspect_nvdb_network_schema.py'
      - 'scripts/match_points_to_nvdb_roads.py'
      - 'scripts/build_nvdb_validation_report.py'
      - 'tests/test_build_lulea_police_review.py'
      - 'tests/test_enrich_police_nvr_geography.py'
      - 'tests/test_extract_police_wildlife_incidents.py'
      - 'tests/test_match_police_nvr_temporal.py'
      - 'tests/test_inspect_ortnamn_geopackage.py'
      - 'tests/test_inspect_nvdb_network_schema.py'
      - 'tests/test_match_points_to_nvdb_roads.py'
      - 'tests/test_build_nvdb_validation_report.py'
      - '.github/workflows/police-nvr-matching-tests.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/build_lulea_police_review.py'
      - 'scripts/enrich_police_nvr_geography.py'
      - 'scripts/extract_police_wildlife_incidents.py'
      - 'scripts/match_police_nvr_temporal.py'
      - 'tests/test_build_lulea_police_review.py'
      - 'tests/test_enrich_police_nvr_geography.py'
      - 'tests/test_extract_police_wildlife_incidents.py'
      - 'tests/test_match_police_nvr_temporal.py'
      - 'tests/test_match_points_to_nvdb_roads.py'
      - 'scripts/match_points_to_nvdb_roads.py'
      - '.github/workflows/police-nvr-matching-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install geospatial test dependencies
        run: python -m pip install pandas geopandas pyogrio pyproj shapely
      - name: Run Police–NVR and Luleå review tests
        run: >-
          python -m unittest
          tests.test_build_lulea_police_review
          tests.test_enrich_police_nvr_geography
          tests.test_extract_police_wildlife_incidents
          tests.test_match_police_nvr_temporal
          tests.test_inspect_nvdb_network_schema
          tests.test_match_points_to_nvdb_roads
          tests.test_build_nvdb_validation_report
