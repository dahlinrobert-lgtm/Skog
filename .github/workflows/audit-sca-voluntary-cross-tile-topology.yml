name: Audit SCA voluntary cross-tile polygon topology
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/audit_sca_voluntary_cross_tile_topology.py"
      - ".github/workflows/audit-sca-voluntary-cross-tile-topology.yml"
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install MVT and geometry libraries
        run: python -m pip install "requests>=2.31,<3" "mapbox-vector-tile>=2,<3" "shapely>=2,<3"
      - name: Compile
        run: python -m py_compile scripts/audit_sca_voluntary_cross_tile_topology.py
      - name: Audit cross-tile polygon topology
        run: python scripts/audit_sca_voluntary_cross_tile_topology.py
      - name: Validate JSON
        run: python -m json.tool sca-voluntary-cross-tile-topology-audit.json > /dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: sca-voluntary-cross-tile-topology-audit
          path: sca-voluntary-cross-tile-topology-audit.json
          if-no-files-found: error
          retention-days: 30
