name: Trafikverket weekly geodata snapshots

on:
  workflow_dispatch:
  schedule:
    - cron: "50 5 * * 1"

permissions:
  contents: write

concurrency:
  group: trafikverket-weekly-snapshots
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install spatial projection dependency
        run: python -m pip install pyproj
      - name: Validate collector syntax
        run: python -m py_compile scripts/snapshot_trafikverket.py
      - name: Download weekly source snapshots
        run: python scripts/snapshot_trafikverket.py
      - name: Check snapshot completeness
        run: |
          python - <<'PY'
          import json, pathlib, sys
          p=pathlib.Path("data/trafikverket/snapshots")
          manifests=list(p.glob("*/manifest.json"))
          if not manifests:
              raise SystemExit("No snapshot manifest created")
          m=json.loads(manifests[-1].read_text())
          assert m["total_feature_layers"] > 0
          assert m["total_downloaded_features"] > 0
          for service in m["services"]:
              for layer in service["layers"]:
                  f=pathlib.Path(layer["file"])
                  assert f.exists() and f.stat().st_size > 0, f"Missing/empty {f}"
                  assert layer["downloaded_feature_count"] == layer["source_object_id_count"], (
                      f"Partial download in {f}: {layer['downloaded_feature_count']} / {layer['source_object_id_count']}"
                  )
          print(f"Validated {m['total_feature_layers']} layers and {m['total_downloaded_features']} features")
          PY
      - name: Commit immutable dated snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/trafikverket/snapshots/
          if git diff --cached --quiet; then
            echo "No snapshot changes to commit."
          else
            git commit -m "data: Trafikverket snapshot $(date -u +%F)"
            git push
          fi
      - name: Upload snapshot bundle
        uses: actions/upload-artifact@v4
        with:
          name: trafikverket-geodata-snapshot-${{ github.run_id }}
          path: data/trafikverket/snapshots/
          if-no-files-found: error
          retention-days: 90
