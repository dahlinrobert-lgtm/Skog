name: Extract OneDrive volume diagnostic reports

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: extract-onedrive-volume-diagnostic
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install download dependency
        run: python -m pip install requests
      - name: Download private OneDrive archive and extract JSON reports
        env:
          ONEDRIVE_CLIENT_ID: ${{ secrets.ONEDRIVE_CLIENT_ID }}
          ONEDRIVE_REFRESH_TOKEN: ${{ secrets.ONEDRIVE_REFRESH_TOKEN }}
        run: python scripts/extract_onedrive_diagnostic_reports.py
      - name: Upload compact JSON reports
        uses: actions/upload-artifact@v4
        with:
          name: extracted-volume-diagnostic-json
          path: diagnostic-json/*.json
          if-no-files-found: error
          retention-days: 14
