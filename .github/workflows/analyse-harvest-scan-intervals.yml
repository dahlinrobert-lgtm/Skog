name: Analyse completed harvest timing against laser scans

on:
  workflow_dispatch:
    inputs:
      raster_codes:
        description: Raster extents to evaluate (12,21,23)
        required: true
        default: "12,21,23"
        type: string
      sample_limit:
        description: Maximum completed polygons per raster (0 means all)
        required: true
        default: "0"
        type: string

permissions:
  contents: read

concurrency:
  group: harvest-scan-temporal-intervals
  cancel-in-progress: false

jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install requests shapely pyproj
      - name: Download selected volume rasters from personal OneDrive
        env:
          RASTER_CODES: ${{ inputs.raster_codes || '12,21,23' }}
          ONEDRIVE_CLIENT_ID: ${{ secrets.ONEDRIVE_CLIENT_ID }}
          ONEDRIVE_REFRESH_TOKEN: ${{ secrets.ONEDRIVE_REFRESH_TOKEN }}
        run: python scripts/download_rasters_from_onedrive.py
      - name: Collect laser scan metadata
        env:
          RASTER_CODES: ${{ inputs.raster_codes || '12,21,23' }}
        run: |
          python -m pip install rasterio
          python scripts/collect_omdrev_flight_metadata.py
      - name: Analyse completed harvest intervals
        run: |
          python scripts/analyze_harvest_scan_intervals.py \
            --raster-codes "${{ inputs.raster_codes || '12,21,23' }}" \
            --limit "${{ inputs.sample_limit || '0' }}"
      - name: Upload harvest-to-scan interval analysis
        uses: actions/upload-artifact@v4
        with:
          name: completed-harvest-scan-intervals
          path: |
            raster-three-omdrev/flight_metadata/completed_harvest_scan_intervals.csv
            raster-three-omdrev/flight_metadata/completed_harvest_scan_intervals_summary.json
            raster-three-omdrev/flight_metadata/laser_scan_metadata_summary.json
          if-no-files-found: error
          retention-days: 30
