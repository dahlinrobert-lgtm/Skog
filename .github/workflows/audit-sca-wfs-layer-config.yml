name: Audit SCA WFS layer configuration
on:
  push:
    branches: [investigate/**]
    paths:
      - "scripts/audit_sca_wfs_layer_config.py"
      - ".github/workflows/audit-sca-wfs-layer-config.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "requests>=2.31,<3"
      - run: python scripts/audit_sca_wfs_layer_config.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sca-wfs-layer-config
          path: artifacts/sca-wfs-layer-config.json
          retention-days: 30
