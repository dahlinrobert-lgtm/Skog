name: Länsstyrelsen protected-area match tests

on:
  pull_request:
    paths:
      - "scripts/lansstyrelsen_diary_protected_area_match.py"
      - "scripts/test_lansstyrelsen_diary_protected_area_match.py"
      - "scripts/lansstyrelsen_diary_fetch_protected_areas.py"
      - "scripts/test_lansstyrelsen_diary_fetch_protected_areas.py"
      - ".github/workflows/lansstyrelsen-diary-protected-area-match-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "shapely>=2.0,<3" "pyproj>=3.6,<4" "pytest>=8,<9" "pyshp>=2.3,<3"
      - run: PYTHONPATH=scripts pytest -q scripts/test_lansstyrelsen_diary_protected_area_match.py scripts/test_lansstyrelsen_diary_fetch_protected_areas.py
