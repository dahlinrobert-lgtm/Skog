name: Build SCA national voluntary geometry run
on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Run ID from the completed national z12 tile expansion"
        required: true
      batch_count:
        description: "Number of tile batches in the source run"
        required: true
        default: "25"
permissions:
  contents: read
  actions: read
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Create geometry batch matrix
        id: set-matrix
        env:
          BATCH_COUNT: ${{ inputs.batch_count }}
        run: |
          python - <<'PY'
          import json, os
          count = max(1, min(100, int(os.environ["BATCH_COUNT"])))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write("matrix=" + json.dumps(list(range(count))) + "\\n")
          print(f"Geometry batches to build: {count}")
          PY
  build:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        batch: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install geometry dependencies
        run: python -m pip install "shapely>=2,<3"
      - name: Download raw national tile batch
        uses: actions/download-artifact@v4
        with:
          name: sca-national-voluntary-tile-expansion-z12-batch-${{ matrix.batch }}
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: input
      - name: Compile and build projected geometries
        run: |
          python -m py_compile scripts/build_sca_national_voluntary_geometry_batch.py
          python scripts/build_sca_national_voluntary_geometry_batch.py
      - name: Validate geometry outputs
        run: |
          python -m json.tool output/sca-voluntary-batch-summary.json > /dev/null
          python -m json.tool output/sca-voluntary-batch-manifest.json > /dev/null
      - name: Upload geometry batch
        uses: actions/upload-artifact@v4
        with:
          name: sca-voluntary-geometry-batch-${{ matrix.batch }}
          path: output/
          if-no-files-found: error
          retention-days: 90
