name: Compare volume rasters across three omdrev

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compare-three-omdrev-volume-rasters
  cancel-in-progress: false

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install comparison dependencies
        run: python -m pip install requests rasterio numpy
      - name: Build 50 m comparisons for areas 13, 21 and 23
        env:
          ONEDRIVE_CLIENT_ID: \${{ secrets.ONEDRIVE_CLIENT_ID }}
          ONEDRIVE_REFRESH_TOKEN: \${{ secrets.ONEDRIVE_REFRESH_TOKEN }}
        run: python scripts/compare_three_omdrev_volume.py
      - name: Upload difference rasters and report
        uses: actions/upload-artifact@v4
        with:
          name: three-omdrev-volume-comparison
          path: raster-three-omdrev/
          if-no-files-found: error
          retention-days: 30
