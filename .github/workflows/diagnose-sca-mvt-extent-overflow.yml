name: Diagnose raw SCA MVT extent overflow
on:
  workflow_dispatch:
    inputs:
      edge_run_id:
        description: "Successful tile-edge diagnostic run ID"
        required: true
        default: "41870299256"
      source_run_id:
        description: "Successful raw z12 tile expansion run ID"
        required: true
        default: "41704577034"
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install "shapely>=2,<3" pytest
      - name: Download tile-edge diagnostics
        uses: actions/download-artifact@v4
        with:
          name: sca-mvt-tile-edge-diagnostics
          run-id: ${{ inputs.edge_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: input/edge
      - name: Download raw national z12 tile batches
        uses: actions/download-artifact@v4
        with:
          pattern: sca-national-voluntary-tile-expansion-z12-batch-*
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: input/raw
      - name: Run raw MVT extent regression tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest -q tests/test_diagnose_sca_mvt_extent_overflow.py
      - name: Build raw extent diagnostics
        run: |
          python -m py_compile scripts/diagnose_sca_mvt_extent_overflow.py
          python scripts/diagnose_sca_mvt_extent_overflow.py
      - name: Validate extent diagnostics
        run: |
          python -m json.tool output/sca-mvt-extent-overflow-summary.json > /dev/null
          python - <<'PY'
          import csv, json
          from pathlib import Path
          s=json.loads(Path("output/sca-mvt-extent-overflow-summary.json").read_text())
          rows=list(csv.DictReader(open("output/sca-mvt-extent-overflow-pair-diagnostics.csv",encoding="utf-8-sig")))
          assert len(rows)==s["input_relations"]
          assert len(rows)==60
          assert s["identity_resolved_relations"]==0
          assert all(r["identity_resolved"]=="False" for r in rows)
          print(json.dumps(s,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: sca-mvt-extent-overflow-diagnostics
          path: output/
          if-no-files-found: error
          retention-days: 90
