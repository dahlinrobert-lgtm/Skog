name: Read-only Samråd archive inventory
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/inventory_samrad_snapshots.py"
      - ".github/workflows/inventory-samrad-archives.yml"
      - "scripts/build_harvest_event_bundle.py"
      - "data/samrad_snapshots/**"
      - "data/harvest_event_bundle.json"
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || 'main' }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install inventory dependencies
        run: python -m pip install "shapely>=2.0,<3" "pyproj>=3.6,<4"
      - name: Compile inventory script
        run: python -m py_compile scripts/inventory_samrad_snapshots.py
      - name: Inventory all archived snapshots against production gate
        run: python scripts/inventory_samrad_snapshots.py
      - name: Upload read-only inventory report
        uses: actions/upload-artifact@v4
        with:
          name: samrad-snapshot-inventory-${{ github.run_id }}
          path: artifacts/samrad-snapshot-inventory.json
          if-no-files-found: error
          retention-days: 30
