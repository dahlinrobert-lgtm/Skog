name: Migrate Kungjort archive to Azure Blob Storage

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: List and hash source files without uploading
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: kungjort-azure-migration
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out current public archive
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Sign in to Azure with GitHub OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Azure SDK
        run: python -m pip install --disable-pip-version-check "azure-identity>=1.17,<2" "azure-storage-blob>=12.20,<13"

      - name: Preview or migrate archive
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          args=(--account-name stskogkolldata --source data/kungjort)
          if [[ "$DRY_RUN" == "true" ]]; then
            args+=(--dry-run)
          fi
          python scripts/migrate_kungjort_archive_to_azure.py "${args[@]}"

      - name: Write non-sensitive migration summary
        if: always()
        run: |
          {
            echo "Migration workflow finished. See the Preview or migrate archive step for batch counts and hashes."
            echo "Raw document batches are not uploaded as GitHub Actions artifacts."
          } >> "$GITHUB_STEP_SUMMARY"
