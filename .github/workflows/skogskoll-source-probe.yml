name: Skogskoll source probe
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/skogskoll-source-probe.yml"
      - "skogskoll/scripts/**"
      - "skogskoll/src/**"
      - "skogskoll/tests/**"
      - "skogskoll/README.md"
      - "skogskoll/INGESTION.md"
      - "skogskoll/db/**"
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
permissions:
  contents: read
  actions: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Test deterministic ingestion and pagination core
        run: node --test skogskoll/tests/*.test.mjs
      - name: Syntax-check source probe and ingestion core
        run: |
          node --check skogskoll/scripts/probe-source.mjs
          node --check skogskoll/scripts/run-scan.mjs
          node --check skogskoll/src/scan-plan.mjs
          node --check skogskoll/src/scan-worker-core.mjs
          node --check skogskoll/src/observation-core.mjs
          node --check skogskoll/src/supabase-adapters.mjs
      - name: Probe public ArcGIS source (read-only)
        run: node skogskoll/scripts/probe-source.mjs
      - name: Upload source diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skogskoll-source-probe-${{ github.run_id }}
          path: skogskoll/reports/source-probe-latest.json
          if-no-files-found: warn
          retention-days: 30
