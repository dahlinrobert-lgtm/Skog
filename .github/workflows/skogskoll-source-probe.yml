name: Skogskoll source probe
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/skogskoll-source-probe.yml"
      - "skogskoll/scripts/**"
      - "skogskoll/src/**"
      - "skogskoll/tests/**"
      - "skogskoll/README.md"
      - "skogskoll/INGESTION.md"
      - "skogskoll/db/**"
  pull_request:
    paths:
      - ".github/workflows/skogskoll-source-probe.yml"
      - "skogskoll/scripts/**"
      - "skogskoll/src/**"
      - "skogskoll/tests/**"
      - "skogskoll/README.md"
      - "skogskoll/INGESTION.md"
      - "skogskoll/db/**"
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
permissions:
  contents: read
  actions: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Test deterministic ingestion, pagination and geometry matching
        run: node --test skogskoll/tests/*.test.mjs
      - name: Check Skogskoll SQL migration structure
        run: |
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const sql = readFileSync("skogskoll/db/migrations/003_atomic_page_commit.sql", "utf8");
            const required = [
              "skogskoll_start_scan", "skogskoll_commit_page", "skogskoll_finish_scan",
              "skogskoll_fail_scan", "skogskoll_recover_stale_scan",
              "scan_sessions_one_running_per_source_idx",
              "grant execute on function public.skogskoll_recover_stale_scan(text,timestamptz,text) to service_role"
            ];
            const missing = required.filter(token => !sql.toLowerCase().includes(token.toLowerCase()));
            if (missing.length) throw new Error("Migration missing required guardrails: " + missing.join(", "));
            if (!sql.includes("language plpgsql") || !sql.includes("security definer")) throw new Error("Migration function security declarations missing");
            const recovery = sql.slice(sql.lastIndexOf("create or replace function public.skogskoll_recover_stale_scan"));
            if (!/as \$\$\s*declare/.test(recovery) || !/end;\s*\$\$;/.test(recovery)) {
              throw new Error("Stale recovery function has invalid PL/pgSQL dollar delimiters");
            }
            const functions = [...sql.matchAll(/create or replace function public\.skogskoll_[\s\S]*?\n\$\$;/g)];
            if (functions.length < 5) throw new Error("Expected all five Skogskoll RPC functions to use closed dollar-quoted bodies");
            console.log("Migration structure guardrails present:", required.length, "and", functions.length, "closed function bodies");
          '
      - name: Test shared map radius filter
        run: node --test tests/map-radius-filter.test.mjs
      - name: Syntax-check shared map radius filter
        run: node --check docs/map-radius-filter.mjs
      - name: Syntax-check source probe and ingestion core
        run: |
          node --check skogskoll/scripts/probe-source.mjs
          node --check skogskoll/scripts/compare-probes.mjs
          node --check skogskoll/scripts/run-scan.mjs
          node --check skogskoll/scripts/recover-stale-scan.mjs
          node --check skogskoll/src/scan-plan.mjs
          node --check skogskoll/src/scan-worker-core.mjs
          node --check skogskoll/src/observation-core.mjs
          node --check skogskoll/src/supabase-adapters.mjs
          node --check skogskoll/src/geometry-match.mjs
      - name: Syntax-check standalone Skogskoll page script
        run: |
          node --input-type=module -e '
            import { readFileSync, writeFileSync } from "node:fs";
            const html = readFileSync("skogskoll/index.html", "utf8");
            const match = html.match(/<script>([\s\S]*?)<\/script>/i);
            if (!match) throw new Error("No inline script found in Skogskoll page");
            writeFileSync("/tmp/skogskoll-page.js", match[1]);
          '
          node --check /tmp/skogskoll-page.js
      - name: Probe public ArcGIS source (read-only)
        run: node skogskoll/scripts/probe-source.mjs
      - name: Upload source diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skogskoll-source-probe-${{ github.run_id }}
          path: skogskoll/reports/source-probe-latest.json
          if-no-files-found: warn
          retention-days: 30
