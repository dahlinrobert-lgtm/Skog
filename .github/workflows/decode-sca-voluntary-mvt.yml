name: Decode one SCA voluntary set-aside MVT tile

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/decode_sca_voluntary_mvt.py"
      - ".github/workflows/decode-sca-voluntary-mvt.yml"

permissions:
  contents: read

jobs:
  decode:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install decoder
        run: python -m pip install "requests>=2.31,<3" "mapbox-vector-tile>=2,<3"
      - name: Decode one bounded tile
        run: python scripts/decode_sca_voluntary_mvt.py
      - name: Validate schema report
        run: python -m json.tool sca-voluntary-mvt-schema.json > /dev/null
      - name: Upload schema report
        uses: actions/upload-artifact@v4
        with:
          name: sca-voluntary-mvt-schema
          path: sca-voluntary-mvt-schema.json
          if-no-files-found: error
          retention-days: 30
