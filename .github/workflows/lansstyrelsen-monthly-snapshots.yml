name: Collect Länsstyrelsen monthly diary snapshots

on:
  workflow_dispatch:
    inputs:
      year:
        description: Registration year
        required: true
        default: "2026"
        type: string
      month:
        description: Registration month (1-12)
        required: true
        default: "10"
        type: string
      county_scope:
        description: County coverage
        required: true
        default: norrbotten
        type: choice
        options:
          - norrbotten
          - vasterbotten
          - both
      category:
        description: Search category
        required: true
        default: B
        type: choice
        options:
          - A
          - B
          - both

permissions:
  contents: write

concurrency:
  group: lansstyrelsen-monthly-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test snapshot, pagination and persistence rules
        env:
          PYTHONPATH: scripts
        run: |
          python -m unittest scripts.test_lansstyrelsen_snapshot_extraction scripts.test_lansstyrelsen_diary_pagination scripts.test_lansstyrelsen_diary_validation scripts.test_lansstyrelsen_snapshot_persistence scripts.test_lansstyrelsen_monthly_snapshot
      - name: Install browser dependencies
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Resolve target month
        id: setup
        env:
          YEAR_INPUT: ${{ inputs.year }}
          MONTH_INPUT: ${{ inputs.month }}
        run: |
          set -euo pipefail
          python - "$YEAR_INPUT" "$MONTH_INPUT" <<'PY'
          import calendar, sys
          year, month = map(int, sys.argv[1:])
          if not 1900 <= year <= 2100 or not 1 <= month <= 12:
              raise SystemExit("Invalid year/month")
          print(f"Validated period: {year:04d}-{month:02d}-01 to {year:04d}-{month:02d}-{calendar.monthrange(year, month)[1]:02d}")
          PY
          echo "year=$YEAR_INPUT" >> "$GITHUB_OUTPUT"
          echo "month=$MONTH_INPUT" >> "$GITHUB_OUTPUT"
          mkdir -p monthly-snapshot-runs
      - name: Collect configured county and category intervals
        env:
          YEAR: ${{ steps.setup.outputs.year }}
          MONTH: ${{ steps.setup.outputs.month }}
          COUNTY_INPUT: ${{ inputs.county_scope }}
          CATEGORY_INPUT: ${{ inputs.category }}
        run: |
          set -euo pipefail
          case "$COUNTY_INPUT" in
            norrbotten) counties=("Länsstyrelsen i Norrbottens län") ;;
            vasterbotten) counties=("Länsstyrelsen i Västerbottens län") ;;
            both) counties=("Länsstyrelsen i Norrbottens län" "Länsstyrelsen i Västerbottens län") ;;
            *) echo "Invalid county scope" >&2; exit 1 ;;
          esac
          case "$CATEGORY_INPUT" in
            A) categories=("A") ;;
            B) categories=("B") ;;
            both) categories=("A" "B") ;;
            *) echo "Invalid category" >&2; exit 1 ;;
          esac
          termsA=("skogsbilväg" "vägbyggnad" "ledningsdragning" "schaktning" "utfyllnad" "massupplag")
          termsB=("vattenverksamhet" "markavvattning" "dikesrensning" "trumma" "våtmarksanläggning" "omgrävning av vattendrag")
          expected=$(( ${#counties[@]} * ${#categories[@]} * 6 ))
          count=0
          for county in "${counties[@]}"; do
            slug="norrbotten"
            [[ "$county" == *Västerbottens* ]] && slug="vasterbotten"
            for category in "${categories[@]}"; do
              terms=("${termsA[@]}")
              [[ "$category" == "B" ]] && terms=("${termsB[@]}")
              for i in "${!terms[@]}"; do
                term="${terms[$i]}"
                outfile="monthly-snapshot-runs/${slug}-${category}-${i}.json"
                echo "Collecting $county / $category / $term / $YEAR-$MONTH"
                python scripts/collect_lansstyrelsen_monthly_snapshot.py \
                  --county "$county" --term "$term" --year "$YEAR" --month "$MONTH" \
                  --output "$outfile"
                count=$((count + 1))
              done
            done
          done
          actual=$(find monthly-snapshot-runs -maxdepth 1 -name '*.json' | wc -l)
          test "$count" -eq "$expected"
          test "$actual" -eq "$expected"
          echo "Collected all $actual expected query intervals."
      - name: Persist each reconciled query as immutable snapshot
        env:
          PYTHONPATH: scripts
        run: |
          set -euo pipefail
          files=(monthly-snapshot-runs/*.json)
          test -f "${files[0]}"
          for file in "${files[@]}"; do
            echo "Persisting $file"
            python scripts/persist_lansstyrelsen_snapshots.py --input "$file"
          done
          python - <<'PY'
          import json
          from pathlib import Path
          manifest=Path("data/lansstyrelsen-diary/snapshot-runs.jsonl")
          rows=[json.loads(line) for line in manifest.read_text(encoding="utf-8").splitlines() if line.strip()]
          count=len(list(Path("monthly-snapshot-runs").glob("*.json")))
          recent=rows[-count:]
          if count == 0 or len(recent) != count:
              raise SystemExit("Manifest count does not match collected query count")
          if not all(row.get("run_complete") and row.get("snapshot_written") for row in recent):
              raise SystemExit("At least one query was not persisted as a complete snapshot")
          print(f"Verified {len(recent)} complete snapshot manifests")
          PY
      - name: Publish immutable snapshots and manifests
        if: success() && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/lansstyrelsen-diary/snapshots data/lansstyrelsen-diary/snapshot-runs.jsonl
          if git diff --cached --quiet; then
            echo "No new snapshot data to publish."
            exit 0
          fi
          git commit -m "Archive monthly Länsstyrelsen diary snapshots"
          git push origin HEAD:main
      - name: Upload monthly collection diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lansstyrelsen-monthly-snapshot-diagnostics
          path: monthly-snapshot-runs/
          if-no-files-found: warn
          retention-days: 30
