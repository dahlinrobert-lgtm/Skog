name: Collect Länsstyrelsen monthly diary snapshots

on:
  workflow_dispatch:
    inputs:
      year:
        description: Registration year
        required: true
        default: "2026"
        type: string
      month:
        description: Registration month (1-12)
        required: true
        default: "10"
        type: string
      county_scope:
        description: County coverage
        required: true
        default: norrbotten
        type: choice
        options:
          - norrbotten
          - vasterbotten
          - both
      category:
        description: Search category
        required: true
        default: B
        type: choice
        options:
          - A
          - B
          - both
  pull_request:
    paths:
      - "scripts/collect_lansstyrelsen_monthly_snapshot.py"
      - "scripts/persist_lansstyrelsen_snapshots.py"
      - "scripts/lansstyrelsen_pager.py"
      - "scripts/test_lansstyrelsen_snapshot_extraction.py"
      - "scripts/test_lansstyrelsen_diary_pagination.py"
      - "scripts/test_lansstyrelsen_diary_validation.py"
      - "scripts/test_lansstyrelsen_snapshot_persistence.py"
      - "scripts/test_lansstyrelsen_monthly_snapshot.py"
      - "scripts/test_lansstyrelsen_workflow_publication.py"
      - ".github/workflows/lansstyrelsen-monthly-snapshots.yml"

permissions:
  contents: write
  pull-requests: write

concurrency:
  # Shared with the daily diary workflow; both append to the same source-owned archive.
  group: ${{ github.event_name == 'pull_request' && format('lansstyrelsen-validation-{0}', github.workflow) || 'lansstyrelsen-diary-archive' }}
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || 'main' }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python and browser dependencies
        if: github.event_name != 'pull_request'
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Test snapshot, pagination, persistence and publication rules
        env:
          PYTHONPATH: scripts
        run: |
          python -m unittest scripts.test_lansstyrelsen_snapshot_extraction scripts.test_lansstyrelsen_diary_pagination scripts.test_lansstyrelsen_diary_validation scripts.test_lansstyrelsen_snapshot_persistence scripts.test_lansstyrelsen_monthly_snapshot scripts.test_lansstyrelsen_workflow_publication
      - name: Resolve target month
        if: github.event_name != 'pull_request'
        id: setup
        env:
          YEAR_INPUT: ${{ inputs.year }}
          MONTH_INPUT: ${{ inputs.month }}
        run: |
          set -euo pipefail
          python - "$YEAR_INPUT" "$MONTH_INPUT" <<'PY'
          import calendar, sys
          year, month = map(int, sys.argv[1:])
          if not 1900 <= year <= 2100 or not 1 <= month <= 12:
              raise SystemExit("Invalid year/month")
          print(f"Validated period: {year:04d}-{month:02d}-01 to {year:04d}-{month:02d}-{calendar.monthrange(year, month)[1]:02d}")
          PY
          echo "year=$YEAR_INPUT" >> "$GITHUB_OUTPUT"
          echo "month=$MONTH_INPUT" >> "$GITHUB_OUTPUT"
          mkdir -p monthly-snapshot-runs
      - name: Collect configured county and category intervals
        if: github.event_name != 'pull_request'
        env:
          YEAR: ${{ steps.setup.outputs.year }}
          MONTH: ${{ steps.setup.outputs.month }}
          COUNTY_INPUT: ${{ inputs.county_scope }}
          CATEGORY_INPUT: ${{ inputs.category }}
        run: |
          set -euo pipefail
          case "$COUNTY_INPUT" in
            norrbotten) counties=("Länsstyrelsen i Norrbottens län") ;;
            vasterbotten) counties=("Länsstyrelsen i Västerbottens län") ;;
            both) counties=("Länsstyrelsen i Norrbottens län" "Länsstyrelsen i Västerbottens län") ;;
            *) echo "Invalid county scope" >&2; exit 1 ;;
          esac
          case "$CATEGORY_INPUT" in
            A) categories=("A") ;;
            B) categories=("B") ;;
            both) categories=("A" "B") ;;
            *) echo "Invalid category" >&2; exit 1 ;;
          esac
          termsA=("skogsbilväg" "vägbyggnad" "ledningsdragning" "schaktning" "utfyllnad" "massupplag")
          termsB=("vattenverksamhet" "markavvattning" "dikesrensning" "trumma" "våtmarksanläggning" "omgrävning av vattendrag")
          expected=$(( ${#counties[@]} * ${#categories[@]} * 6 ))
          count=0
          for county in "${counties[@]}"; do
            slug="norrbotten"
            [[ "$county" == *Västerbottens* ]] && slug="vasterbotten"
            for category in "${categories[@]}"; do
              terms=("${termsA[@]}")
              [[ "$category" == "B" ]] && terms=("${termsB[@]}")
              for i in "${!terms[@]}"; do
                term="${terms[$i]}"
                outfile="monthly-snapshot-runs/${slug}-${category}-${i}.json"
                echo "Collecting $county / $category / $term / $YEAR-$MONTH"
                python scripts/collect_lansstyrelsen_monthly_snapshot.py \
                  --county "$county" --term "$term" --year "$YEAR" --month "$MONTH" \
                  --output "$outfile"
                count=$((count + 1))
              done
            done
          done
          actual=$(find monthly-snapshot-runs -maxdepth 1 -name '*.json' | wc -l)
          test "$count" -eq "$expected"
          test "$actual" -eq "$expected"
          echo "Collected all $actual expected query intervals."
      - name: Persist each reconciled query as immutable snapshot
        if: success() && github.event_name != 'pull_request'
        env:
          PYTHONPATH: scripts
        run: |
          set -euo pipefail
          files=(monthly-snapshot-runs/*.json)
          test -f "${files[0]}"
          for file in "${files[@]}"; do
            echo "Persisting $file"
            python scripts/persist_lansstyrelsen_snapshots.py --input "$file"
          done
          python - <<'PY'
          import json
          from pathlib import Path
          manifest=Path("data/lansstyrelsen-diary/snapshot-runs.jsonl")
          rows=[json.loads(line) for line in manifest.read_text(encoding="utf-8").splitlines() if line.strip()]
          count=len(list(Path("monthly-snapshot-runs").glob("*.json")))
          recent=rows[-count:]
          if count == 0 or len(recent) != count:
              raise SystemExit("Manifest count does not match collected query count")
          if not all(row.get("run_complete") and row.get("snapshot_written") for row in recent):
              raise SystemExit("At least one query was not persisted as a complete snapshot")
          print(f"Verified {len(recent)} complete snapshot manifests")
          PY
      - name: Create or update monthly diary snapshot pull request
        if: success() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ github.token }}
          branch: automation/lansstyrelsen-diary-history
          delete-branch: true
          add-paths: |
            data/lansstyrelsen-diary/snapshots/
            data/lansstyrelsen-diary/snapshot-runs.jsonl
          commit-message: "Archive monthly Länsstyrelsen diary snapshots"
          title: "data: archive monthly Länsstyrelsen diary snapshots"
          body: |
            Automated monthly public-diary snapshots.

            - Each configured county/search-term/registration-period interval was validated and reconciled.
            - All immutable snapshots and their append-only manifest rows are included.

            Review exact county, category, registration period, pagination and counts before merging. A missing case in a query interval is not interpreted as removal. This PR does not authorize customer display, commercial reuse, or redistribution.
      - name: Upload monthly collection diagnostics
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: lansstyrelsen-monthly-snapshot-diagnostics
          path: monthly-snapshot-runs/
          if-no-files-found: warn
          retention-days: 30
