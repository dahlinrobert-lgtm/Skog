name: Inventory OneDrive volume rasters

on:
  workflow_dispatch:
    inputs:
      raster_keys:
        description: "Comma-separated keys, e.g. omdrev2_23,omdrev3_23. Leave blank for all 37."
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: onedrive-volume-raster-inventory
  cancel-in-progress: false

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install raster inspection dependencies
        run: python -m pip install requests rasterio
      - name: Download and inspect OneDrive rasters
        env:
          ONEDRIVE_CLIENT_ID: ${{ secrets.ONEDRIVE_CLIENT_ID }}
          ONEDRIVE_REFRESH_TOKEN: ${{ secrets.ONEDRIVE_REFRESH_TOKEN }}
          RASTER_KEYS: ${{ inputs.raster_keys }}
        run: python scripts/inventory_onedrive_volume_rasters.py
      - name: Upload inventory report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: onedrive-volume-raster-inventory
          path: raster-inventory/inventory.json
          if-no-files-found: warn
          retention-days: 30
