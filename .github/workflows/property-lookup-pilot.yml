name: Property lookup polygon pilot
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install geospatial dependencies
        run: python -m pip install requests shapely pyproj
      - name: Screen 20 nearby notifications with six samples each
        run: python scripts/property_lookup_pilot.py
      - name: Commit pilot report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/property_lookup_pilot.json
          if ! git diff --cached --quiet; then
            git commit -m "Add polygon property lookup pilot results"
            git push
          fi
