name: Verify Skogsstyrelsen volume metadata and extreme pixels

on:
  workflow_dispatch:
    inputs:
      raster_codes:
        description: Omdrev 3 raster archives to inspect
        required: true
        default: "12,21,23"
        type: string
      max_metadata_samples:
        description: Maximum representative 2.5 km sample points per raster
        required: true
        default: "2500"
        type: string

permissions:
  contents: read

concurrency:
  group: skogliga-metadata-outlier-verification
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install verification dependencies
        run: python -m pip install --disable-pip-version-check numpy rasterio requests
      - name: Download missing original rasters from personal OneDrive
        env:
          RASTER_CODES: \${{ inputs.raster_codes || '12,21,23' }}
          ONEDRIVE_CLIENT_ID: \${{ secrets.ONEDRIVE_CLIENT_ID }}
          ONEDRIVE_CLIENT_SECRET: \${{ secrets.ONEDRIVE_CLIENT_SECRET }}
          ONEDRIVE_REFRESH_TOKEN: \${{ secrets.ONEDRIVE_REFRESH_TOKEN }}
        run: python scripts/download_rasters_from_onedrive.py
      - name: Verify metadata samples and outlier pixels against Skogsstyrelsen REST
        env:
          RASTER_CODES: \${{ inputs.raster_codes || '12,21,23' }}
          MAX_METADATA_SAMPLES: \${{ inputs.max_metadata_samples || '2500' }}
        run: python scripts/verify_skogliga_metadata.py
      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skogliga-metadata-outlier-verification
          path: data/skogliga-grunddata/metadata-outlier-verification.json
          if-no-files-found: warn
          retention-days: 30
