name: Analyse real harvest polygons against volume rasters
on:
  workflow_dispatch:
    inputs:
      sample_limit:
        description: Maximum real polygons per raster area (validation sample; 0 means all)
        required: true
        default: "0"
        type: string
      raster_codes:
        description: Raster areas to process (07, 10, 12, 13, 21, 23); selected original ZIPs must exist under data/skogliga-grunddata
        required: true
        default: "13"
        type: string
permissions:
  contents: write
concurrency:
  group: real-harvest-volume-publish
  cancel-in-progress: false
jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install analysis dependencies
        run: python -m pip install requests numpy rasterio shapely pyproj
      - name: Fetch real polygons in selected raster extents
        run: python scripts/fetch_real_harvests_for_volume_rasters.py --output real-volume-polygons.geojson --limit "${{ inputs.sample_limit || '0' }}" --raster-codes "${{ inputs.raster_codes || '13' }}"
      - name: Split groups and calculate volume statistics from original rasters
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          doc=json.loads(Path("real-volume-polygons.geojson").read_text(encoding="utf-8"))
          codes=[x.strip() for x in "${{ inputs.raster_codes || '13' }}".split(",") if x.strip()]
          groups={str(g["metadata"]["raster_code"]):g for g in doc["raster_groups"]}
          for code in codes:
              group=groups.get(code)
              if group is None:
                  raise SystemExit(f"Raster group {code} missing from fetched GeoJSON")
              path=Path(f"real-polygons-{code}.geojson")
              path.write_text(json.dumps({"type":"FeatureCollection","features":group["features"]},ensure_ascii=False),encoding="utf-8")
              print(f"raster {code}: {len(group['features'])} real polygons",flush=True)
          PY
          set -e
          for code in $(echo "${{ inputs.raster_codes || '13' }}" | tr ',' ' '); do
            mkdir -p "raster-data-$code"
            cp "data/skogliga-grunddata/sks_Volym_omdrev3_$code.zip" "raster-data-$code/"
            python scripts/analyze_volume_for_polygon.py --polygon "real-polygons-$code.geojson" --data-dir "raster-data-$code" --output "real-volume-report-$code.json"
          done
      - name: Validate and summarize reports
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          summary=[]
          for report_path in sorted(Path(".").glob("real-volume-report-*.json")):
              code=report_path.stem.rsplit("-",1)[-1]
              report=json.loads(report_path.read_text(encoding="utf-8"))
              raster=next((r for r in report["rasters"] if r["source_archive"].endswith(f"_{code}.zip")),None)
              if raster is None:
                  raise SystemExit(f"Raster {code} missing in analysis report. Errors: {report.get('errors',[])}")
              rows=[]
              for item in raster["per_polygon"]:
                  s=item["stats"]
                  rows.append({"objectid":item["properties"].get("OBJECTID"),"kommun":item["properties"].get("Kommun"),
                    "beteckning":item["properties"].get("Beteckn"),"area_ha":item["properties"].get("Arealha"),
                    "status":s["status"],"valid_cells":s["valid_cells"],"coverage_pct":s["valid_coverage_pct"],
                    "mean_m3sk_ha":s["mean_volume_m3sk_per_ha_including_zero"],
                    "estimated_total_m3sk":s["estimated_volume_m3sk_from_valid_cells"]})
              summary.append({"raster":code,"polygon_count":len(rows),"rows":rows})
              print(f"Raster {code}: polygons={len(rows)}; valid={sum(x['status']=='ok' for x in rows)}")
              for x in rows[:8]: print(x)
              if report["errors"]: raise SystemExit(report["errors"])
          Path("real-volume-summary.json").write_text(json.dumps(summary,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          target=Path("docs/volume-overlays/polygon-volume-attributes.json")
          old_doc={}
          if target.exists():
              try: old_doc=json.loads(target.read_text(encoding="utf-8"))
              except (ValueError, OSError): old_doc={}
          processed={g["raster"] for g in summary}
          existing={f"{r.get('raster_code')}:{r.get('objectid')}":r for r in old_doc.get("records",[]) if str(r.get("raster_code")) not in processed}
          records=list(existing.values())
          for group in summary:
              for row in group["rows"]:
                  if row["status"] == "ok":
                      records.append({"objectid":row["objectid"],"raster_code":group["raster"],"kommun":row["kommun"],
                        "beteckning":row["beteckning"],"area_ha":row["area_ha"],"valid_cells":row["valid_cells"],
                        "coverage_pct":row["coverage_pct"],"mean_m3sk_ha":row["mean_m3sk_ha"],
                        "estimated_total_m3sk":row["estimated_total_m3sk"]})
          counts=dict(old_doc.get("sample_counts",{}))
          for g in summary: counts[g["raster"]]={"sampled":g["polygon_count"],"valid":sum(r["status"]=="ok" for r in g["rows"])}
          payload={"dataset":"Skogsstyrelsen Skogliga grunddata – volym omdrev 3",
            "method":"cell-centre inclusion; NoData excluded; valid zero retained",
            "sample_limit_per_raster":max((g["polygon_count"] for g in summary),default=0),
            "note":"Records are computed from the selected original raster and source polygons. Missing IDs mean no valid cell-centre samples in this run, not necessarily missing forest volume.",
            "generated_at_utc":__import__("datetime").datetime.now(__import__("datetime").timezone.utc).isoformat(),
            "sample_counts":counts,"records":records}
          target.parent.mkdir(parents=True,exist_ok=True)
          target.write_text(json.dumps(payload,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          print(f"Prepared public popup lookup: {len(records)} polygons have valid raster values")
          PY
      - name: Publish sampled volume attributes to Pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/volume-overlays/polygon-volume-attributes.json
          if git diff --cached --quiet; then
            echo "Volume attribute lookup unchanged."
          else
            git commit -m "Update sampled polygon volume attributes"
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                echo "Published sampled volume attributes."
                break
              fi
              if [ "$attempt" -eq 5 ]; then
                echo "Could not publish after five attempts." >&2
                exit 1
              fi
              sleep 2
            done
          fi
      - name: Upload real polygon volume analysis and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-harvest-volume-analysis
          path: |
            real-volume-polygons.geojson
            real-polygons-*.geojson
            real-volume-report-*.json
            real-volume-summary.json
          if-no-files-found: warn
          retention-days: 30
