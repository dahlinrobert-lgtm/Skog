name: SCA national ownership-led tile census z9
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/sca_national_ownership_tile_census_z9.py"
      - ".github/workflows/sca-national-ownership-tile-census-z9.yml"
permissions:
  contents: read
jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install MVT decoder
        run: python -m pip install "requests>=2.31,<3" "mapbox-vector-tile>=2,<3"
      - name: Compile
        run: python -m py_compile scripts/sca_national_ownership_tile_census_z9.py
      - name: Census ownership tiles and linked voluntary layer
        run: python scripts/sca_national_ownership_tile_census_z9.py
      - name: Validate JSON
        run: python -m json.tool sca-national-ownership-tile-census-z9.json > /dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: sca-national-ownership-tile-census-z9
          path: sca-national-ownership-tile-census-z9.json
          if-no-files-found: error
          retention-days: 90
