name: Audit SCA tile URL resolution

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/audit_sca_tile_url_resolution.py"
      - ".github/workflows/audit-sca-tile-url-resolution.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install requests
        run: python -m pip install "requests>=2.31,<3"
      - name: Inspect published page and client bundle
        run: python scripts/audit_sca_tile_url_resolution.py
      - name: Upload configuration audit
        uses: actions/upload-artifact@v4
        with:
          name: sca-tile-url-resolution-audit
          path: sca-tile-url-resolution-audit.json
          if-no-files-found: error
          retention-days: 30
