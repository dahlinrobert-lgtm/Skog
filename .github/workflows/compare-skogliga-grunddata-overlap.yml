name: Compare Skogsstyrelsen raster overlap

on:
  workflow_dispatch:
  push:
    paths:
      - "data/skogliga-grunddata/*.zip"
      - "scripts/compare_skogliga_grunddata_overlap.py"
      - ".github/workflows/compare-skogliga-grunddata-overlap.yml"

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install raster analysis dependencies
        run: python -m pip install --disable-pip-version-check numpy rasterio

      - name: Compare raster overlap at pixel level
        run: python scripts/compare_skogliga_grunddata_overlap.py

      - name: Upload overlap analysis report
        uses: actions/upload-artifact@v4
        with:
          name: skogliga-grunddata-overlap-analysis
          path: data/skogliga-grunddata/overlap-analysis-report.json
          if-no-files-found: error
          retention-days: 30
