name: Overlay Omdrev coverage with scan metadata

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: omdrev-coverage-scan-metadata-overlay
  cancel-in-progress: false

jobs:
  overlay:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      RASTER_ROUNDS: "1,2,3"
      RASTER_CODES: "12,21,23"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install raster and vector dependencies
        run: python -m pip install requests rasterio numpy shapely
      - name: Download matched Omdrev 1-3 volume rasters from OneDrive
        env:
          ONEDRIVE_CLIENT_ID: ${{ secrets.ONEDRIVE_CLIENT_ID }}
          ONEDRIVE_REFRESH_TOKEN: ${{ secrets.ONEDRIVE_REFRESH_TOKEN }}
        run: python scripts/download_omdrev_cross_round_pilot.py
      - name: Build spatial coverage masks
        run: python scripts/build_omdrev_spatial_coverage_masks.py
      - name: Prepare Omdrev 3 rasters for scan metadata query
        run: |
          mkdir -p data/skogliga-grunddata
          cp data/omdrev-cross-round-pilot/sks_Volym_omdrev3_*.zip data/skogliga-grunddata/
      - name: Collect scan-index metadata and geometries
        run: python scripts/collect_omdrev_flight_metadata.py
      - name: Overlay all Omdrev coverage cells with scan metadata polygons
        run: python scripts/overlay_omdrev_coverage_with_scan_metadata.py
      - name: Build round-aware metadata inventory and coverage summary
        run: python scripts/summarise_omdrev_scan_metadata_by_round.py
      - name: Upload coverage and scan-metadata overlay
        uses: actions/upload-artifact@v4
        with:
          name: omdrev-coverage-scan-metadata-overlay
          path: |
            raster-three-omdrev/cross_round_pilot/volume_spatial_coverage_2km.csv
            raster-three-omdrev/cross_round_pilot/volume_spatial_coverage_summary.json
            raster-three-omdrev/cross_round_pilot/volume_coverage_scan_metadata_overlay.csv
            raster-three-omdrev/cross_round_pilot/volume_coverage_scan_metadata_overlay_summary.json
            raster-three-omdrev/cross_round_pilot/scan_metadata_inventory_by_round_tile.csv
            raster-three-omdrev/cross_round_pilot/scan_metadata_cell_coverage_by_round_tile.csv
            raster-three-omdrev/cross_round_pilot/scan_metadata_round_aware_summary.json
            raster-three-omdrev/flight_metadata/laser_scan_index_tiles.csv
            raster-three-omdrev/flight_metadata/laser_scan_index_tiles_esrijson.json
            raster-three-omdrev/flight_metadata/laser_scan_metadata_summary.json
          if-no-files-found: error
          retention-days: 30
