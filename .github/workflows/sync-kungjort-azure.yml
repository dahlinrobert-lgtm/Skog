name: Sync Kungjort archive to Azure Blob Storage

on:
  pull_request:
    paths:
      - "scripts/sync_kungjort_azure.py"
      - "tests/test_kungjort_azure_sync.py"
      - ".github/workflows/sync-kungjort-azure.yml"
  workflow_dispatch:
    inputs:
      mode:
        description: Synchronization mode
        required: true
        default: bootstrap
        type: choice
        options:
          - bootstrap
          - changes
          - reclassify
          - quality-report
      max_pages:
        description: Maximum pages or metadata batches to process
        required: true
        default: "300"
        type: string
  schedule:
    - cron: "23 4 * * *"

permissions:
  contents: read
  id-token: write

concurrency:
  group: kungjort-azure-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Azure SDK dependencies
        run: python -m pip install --disable-pip-version-check "azure-identity>=1.17,<2" "azure-storage-blob>=12.20,<13"
      - name: Test Azure sync helpers
        if: github.event_name == 'pull_request'
        run: |
          python -m py_compile scripts/sync_kungjort_azure.py
          python -m unittest discover -s tests -p "test_kungjort_azure_sync.py"
      - name: Resolve run mode
        if: github.event_name != 'pull_request'
        id: mode
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_MAX_PAGES: ${{ inputs.max_pages }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "schedule" ]]; then
            mode="changes"
            max_pages="100"
          else
            mode="${INPUT_MODE:-bootstrap}"
            max_pages="${INPUT_MAX_PAGES:-300}"
          fi
          if ! [[ "$max_pages" =~ ^[0-9]+$ ]] || (( max_pages < 1 || max_pages > 500 )); then
            echo "max_pages must be between 1 and 500" >&2
            exit 1
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "max_pages=$max_pages" >> "$GITHUB_OUTPUT"
      - name: Sign in to Azure with GitHub OIDC
        if: github.event_name != 'pull_request'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Run direct-to-Azure synchronization
        if: github.event_name != 'pull_request'
        env:
          KUNGJORT_API_KEY: ${{ secrets.KUNGJORT_API_KEY }}
        run: |
          set -euo pipefail
          python scripts/sync_kungjort_azure.py \
            --mode "${{ steps.mode.outputs.mode }}" \
            --max-pages "${{ steps.mode.outputs.max_pages }}"
      - name: Upload metadata-only quality review
        if: github.event_name == 'workflow_dispatch' && steps.mode.outputs.mode == 'quality-report'
        uses: actions/upload-artifact@v4
        with:
          name: kungjort-quality-review
          path: kungjort-quality-review.json
          if-no-files-found: error
          retention-days: 7
