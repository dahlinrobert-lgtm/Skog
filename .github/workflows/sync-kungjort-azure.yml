name: Sync Kungjort archive to Azure Blob Storage

on:
  pull_request:
    paths:
      - "scripts/sync_kungjort_azure.py"
      - "tests/test_kungjort_azure_sync.py"
      - "scripts/kungjort_schema_audit.py"
      - "scripts/kungjort_document_selection.py"
      - "scripts/kungjort_selection_inventory.py"
      - "scripts/kungjort_relationship_audit.py"
      - "scripts/kungjort_work_id_audit.py"
      - "tests/test_kungjort_selection_inventory.py"
      - "tests/test_kungjort_relationship_audit.py"
      - "tests/test_kungjort_work_id_audit.py"
      - "tests/test_kungjort_document_selection.py"
      - "tests/test_kungjort_schema_audit.py"
      - ".github/workflows/sync-kungjort-azure.yml"
  workflow_dispatch:
    inputs:
      mode:
        description: Synchronization mode
        required: true
        default: bootstrap
        type: choice
        options:
          - bootstrap
          - changes
          - reclassify
          - quality-report
          - schema-report
          - selection-report
          - relationship-report
          - work-id-report
      max_pages:
        description: Maximum API pages or reclassification batches to process
        required: true
        default: "300"
        type: string
      max_batches:
        description: Maximum archive batches per source prefix for schema-report
        required: true
        default: "20"
        type: string
      selection_max_batches:
        description: Maximum archive batches per source prefix for selection-report
        required: true
        default: "500"
        type: string
  schedule:
    - cron: "23 4 * * *"

permissions:
  contents: read
  id-token: write

concurrency:
  group: kungjort-azure-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Azure SDK dependencies
        run: python -m pip install --disable-pip-version-check "azure-identity>=1.17,<2" "azure-storage-blob>=12.20,<13"
      - name: Test Azure sync helpers
        if: github.event_name == 'pull_request'
        run: |
          python -m py_compile scripts/sync_kungjort_azure.py scripts/kungjort_schema_audit.py scripts/kungjort_document_selection.py scripts/kungjort_selection_inventory.py scripts/kungjort_relationship_audit.py scripts/kungjort_work_id_audit.py
          python -m unittest discover -s tests -p "test_kungjort_*.py"
      - name: Resolve run mode
        if: github.event_name != 'pull_request'
        id: mode
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_MAX_PAGES: ${{ inputs.max_pages }}
          INPUT_MAX_BATCHES: ${{ inputs.max_batches }}
          INPUT_SELECTION_MAX_BATCHES: ${{ inputs.selection_max_batches }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "schedule" ]]; then
            mode="changes"
            max_pages="100"
          else
            mode="${INPUT_MODE:-bootstrap}"
            max_pages="${INPUT_MAX_PAGES:-300}"
          fi
          if ! [[ "$max_pages" =~ ^[0-9]+$ ]] || (( max_pages < 1 || max_pages > 500 )); then
            echo "max_pages must be between 1 and 500" >&2
            exit 1
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "max_pages=$max_pages" >> "$GITHUB_OUTPUT"
          max_batches="${INPUT_MAX_BATCHES:-20}"
          if ! [[ "$max_batches" =~ ^[0-9]+$ ]] || (( max_batches < 1 || max_batches > 500 )); then
            echo "max_batches must be between 1 and 500" >&2
            exit 1
          fi
          echo "max_batches=$max_batches" >> "$GITHUB_OUTPUT"
          selection_max_batches="${INPUT_SELECTION_MAX_BATCHES:-500}"
          if ! [[ "$selection_max_batches" =~ ^[0-9]+$ ]] || (( selection_max_batches < 1 || selection_max_batches > 2000 )); then
            echo "selection_max_batches must be between 1 and 2000" >&2
            exit 1
          fi
          echo "selection_max_batches=$selection_max_batches" >> "$GITHUB_OUTPUT"
      - name: Sign in to Azure with GitHub OIDC
        if: github.event_name != 'pull_request'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Run direct-to-Azure synchronization
        if: github.event_name != 'pull_request' && steps.mode.outputs.mode != 'schema-report' && steps.mode.outputs.mode != 'selection-report' && steps.mode.outputs.mode != 'relationship-report' && steps.mode.outputs.mode != 'work-id-report'
        env:
          KUNGJORT_API_KEY: ${{ secrets.KUNGJORT_API_KEY }}
        run: |
          set -euo pipefail
          python scripts/sync_kungjort_azure.py \
            --mode "${{ steps.mode.outputs.mode }}" \
            --max-pages "${{ steps.mode.outputs.max_pages }}"
      - name: Export value-free schema inventory
        if: github.event_name != 'pull_request' && steps.mode.outputs.mode == 'schema-report'
        run: |
          set -euo pipefail
          python -m py_compile scripts/kungjort_schema_audit.py
          python scripts/kungjort_schema_audit.py --max-batches "${{ steps.mode.outputs.max_batches }}"
      - name: Upload value-free schema inventory
        if: github.event_name != 'pull_request' && steps.mode.outputs.mode == 'schema-report'
        uses: actions/upload-artifact@v4
        with:
          name: kungjort-schema-inventory
          path: schema-report-export/schema-inventory.json
          if-no-files-found: error
          retention-days: 14
      - name: Export private planning selection inventory
        if: github.event_name != 'pull_request' && steps.mode.outputs.mode == 'selection-report'
        run: |
          set -euo pipefail
          python -m py_compile scripts/kungjort_document_selection.py scripts/kungjort_selection_inventory.py
          python scripts/kungjort_selection_inventory.py --max-batches "${{ steps.mode.outputs.selection_max_batches }}"
      - name: Upload aggregate planning selection summary
        if: github.event_name != 'pull_request' && steps.mode.outputs.mode == 'selection-report'
        uses: actions/upload-artifact@v4
        with:
          name: kungjort-planning-selection-summary
          path: selection-report-export/selection-summary.json
          if-no-files-found: error
          retention-days: 14
      - name: Export private planning reference coverage audit
        if: github.event_name != 'pull_request' && steps.mode.outputs.mode == 'relationship-report'
        run: |
          set -euo pipefail
          python -m py_compile scripts/kungjort_relationship_audit.py
          python scripts/kungjort_relationship_audit.py --max-batches 2000
      - name: Upload aggregate planning reference coverage summary
        if: github.event_name != 'pull_request' && steps.mode.outputs.mode == 'relationship-report'
        uses: actions/upload-artifact@v4
        with:
          name: kungjort-planning-reference-coverage
          path: relationship-report-export/reference-coverage-summary.json
          if-no-files-found: error
          retention-days: 14
      - name: Export private work ID and protocol reference audit
        if: github.event_name != 'pull_request' && steps.mode.outputs.mode == 'work-id-report'
        run: |
          set -euo pipefail
          python -m py_compile scripts/kungjort_work_id_audit.py
          python scripts/kungjort_work_id_audit.py --max-batches 2000
      - name: Upload aggregate work ID extraction summary
        if: github.event_name != 'pull_request' && steps.mode.outputs.mode == 'work-id-report'
        uses: actions/upload-artifact@v4
        with:
          name: kungjort-work-id-extraction-summary
          path: work-id-report-export/work-id-summary.json
          if-no-files-found: error
          retention-days: 14
      - name: Export aggregate quality summary
        if: github.event_name != 'pull_request' && steps.mode.outputs.mode == 'quality-report'
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from azure.identity import DefaultAzureCredential
          from azure.storage.blob import BlobServiceClient
          account = "stskogkolldata"
          container = "metadata"
          credential = DefaultAzureCredential()
          service = BlobServiceClient(
              account_url=f"https://{account}.blob.core.windows.net",
              credential=credential,
          )
          try:
              blob = service.get_blob_client(
                  container=container,
                  blob="kungjort/index/reclassified-v2/quality-review.json",
              )
              report = json.loads(blob.download_blob().readall())
              import unicodedata

              def normalize_term(term):
                  value = unicodedata.normalize("NFKD", unicodedata.normalize("NFKC", str(term)).casefold())
                  value = "".join(char for char in value if not unicodedata.combining(char))
                  return " ".join(value.split())

              normalized_terms = {}
              for term, count in report.get("matched_term_counts", {}).items():
                  key = normalize_term(term)
                  normalized_terms[key] = normalized_terms.get(key, 0) + int(count)

              aggregate = {
                  "schema_version": report.get("schema_version"),
                  "generated_at": report.get("generated_at"),
                  "source_batches": report.get("source_batches"),
                  "rows_reviewed": report.get("rows_reviewed"),
                  "priority_counts": report.get("priority_counts", {}),
                  "category_counts": report.get("category_counts", {}),
                  "matched_term_counts": report.get("matched_term_counts", {}),
                  "normalized_matched_term_counts": dict(sorted(normalized_terms.items(), key=lambda item: (-item[1], item[0]))),
                  "privacy_note": "Aggregate counts only; no document IDs, titles, organs, examples, full text or original files.",
              }
              os.makedirs("quality-report-export", exist_ok=True)
              with open("quality-report-export/quality-summary.json", "w", encoding="utf-8") as f:
                  json.dump(aggregate, f, ensure_ascii=False, indent=2)
          finally:
              service.close()
              credential.close()
          PY
      - name: Upload aggregate quality summary
        if: github.event_name != 'pull_request' && steps.mode.outputs.mode == 'quality-report'
        uses: actions/upload-artifact@v4
        with:
          name: kungjort-quality-summary
          path: quality-report-export/quality-summary.json
          if-no-files-found: error
          retention-days: 14
