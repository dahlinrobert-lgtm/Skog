name: Police events raw archive Azure backfill

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type BACKFILL to upload and verify the tracked raw archive"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: skog-police-events-azure-backfill
  cancel-in-progress: false

jobs:
  backfill:
    if: inputs.confirm == 'BACKFILL'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Validate manual confirmation
        env:
          CONFIRMATION: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRMATION" != "BACKFILL" ]; then
            echo "::error::Confirmation must be exactly BACKFILL (uppercase)."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Azure storage dependencies
        run: pip install azure-identity azure-storage-blob
      - name: Sign in to Azure with GitHub OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Backfill and verify legacy raw archive
        env:
          AZURE_STORAGE_ACCOUNT: stskogkolldata
          POLICE_ARCHIVE_CONTAINER: police-events
        run: python scripts/backfill_police_events_blob.py
