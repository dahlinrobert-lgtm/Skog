name: Inventory SCA public map layers

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/inventory_sca_public_layers.py"
      - ".github/workflows/inventory-sca-public-layers.yml"

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install requests
        run: python -m pip install "requests>=2.31,<3"
      - name: Extract public layer inventory
        run: python scripts/inventory_sca_public_layers.py
      - name: Upload inventory
        uses: actions/upload-artifact@v4
        with:
          name: sca-public-layer-inventory
          path: sca-public-layer-inventory.json
          if-no-files-found: error
          retention-days: 30
