name: Police official API evaluation snapshots

on:
  schedule:
    # Existing Brottsplatskartan archive runs at 04:41 UTC.
    # This separate source is sampled 14 minutes later.
    - cron: "55 4 * * *"

permissions:
  contents: read
  id-token: write

concurrency:
  group: skog-polisen-official-api-evaluation
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Capture one official Police API snapshot
        run: |
          python scripts/capture_polisen_official_events.py \
            --output "$RUNNER_TEMP/polisen-official-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.json"
      - name: Sign in to Azure with GitHub OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Upload and verify immutable official API snapshot
        env:
          AZURE_STORAGE_ACCOUNT: stskogkolldata
          POLICE_ARCHIVE_CONTAINER: police-events
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          python scripts/upload_polisen_official_snapshot.py \
            --source "$RUNNER_TEMP/polisen-official-$RUN_ID-$RUN_ATTEMPT.json" \
            --run-id "$RUN_ID" \
            --run-attempt "$RUN_ATTEMPT"
