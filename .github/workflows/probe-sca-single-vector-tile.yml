name: Probe one SCA vector tile
on:
  push:
    branches: [investigate/**]
    paths:
      - "scripts/probe_sca_single_vector_tile.py"
      - ".github/workflows/probe-sca-single-vector-tile.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "requests>=2.31,<3" "mapbox-vector-tile>=2,<3"
      - run: python scripts/probe_sca_single_vector_tile.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sca-single-tile-probe
          path: artifacts/sca-single-tile-probe.json
          retention-days: 30
