name: Discover Länsstyrelsen physical works and water cases

on:
  workflow_dispatch:
    inputs:
      category:
        description: Search category
        required: true
        type: choice
        options:
          - A – Physical works
          - B – Water operations
      county_scope:
        description: County coverage
        required: true
        default: both
        type: choice
        options:
          - both
          - norrbotten
          - vasterbotten

permissions:
  contents: write

concurrency:
  group: lansstyrelsen-action-discovery
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test diary persistence and A/B classification
        run: |
          python -m unittest scripts.test_persist_lansstyrelsen_diary scripts.test_lansstyrelsen_diary_validation scripts.test_audit_lansstyrelsen_diary_history tests.test_lansstyrelsen_action_leads scripts.test_lansstyrelsen_diary_pagination
      - name: Install browser dependencies
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Search selected northern county diaries
        env:
          CATEGORY_INPUT: ${{ inputs.category }}
          COUNTY_SCOPE_INPUT: ${{ inputs.county_scope }}
        run: |
          case "$CATEGORY_INPUT" in
            "A – Physical works")
              primary="skogsbilväg"
              extras=$'vägbyggnad\nledningsdragning\nschaktning\nutfyllnad\nmassupplag'
              ;;
            "B – Water operations")
              primary="vattenverksamhet"
              extras=$'markavvattning\ndikesrensning\ntrumma\nvåtmarksanläggning\nomgrävning av vattendrag'
              ;;
            *)
              echo "Unknown category: $CATEGORY_INPUT" >&2
              exit 1
              ;;
          esac

          case "$COUNTY_SCOPE_INPUT" in
            both)
              counties=("Länsstyrelsen i Norrbottens län" "Länsstyrelsen i Västerbottens län")
              ;;
            norrbotten)
              counties=("Länsstyrelsen i Norrbottens län")
              ;;
            vasterbotten)
              counties=("Länsstyrelsen i Västerbottens län")
              ;;
            *)
              echo "Unknown county scope: $COUNTY_SCOPE_INPUT" >&2
              exit 1
              ;;
          esac

          mkdir -p action-discovery-results
          failed=0
          for county in "${counties[@]}"; do
            slug="northern-counties"
            if [[ "$county" == *Norrbottens* ]]; then slug="norrbotten"; fi
            if [[ "$county" == *Västerbottens* ]]; then slug="vasterbotten"; fi
            output="action-discovery-results/${slug}.json"
            echo "Searching $county for $CATEGORY_INPUT"
            if ! python scripts/search_lansstyrelsen_diary_browser.py \
              --county "$county" \
              --search-term "$primary" \
              --extra-search-terms "$extras" \
              --output "$output"; then
              echo "Search failed for $county; retaining other validated county results."
              failed=1
            fi
          done

          # Do not fail here: valid county outputs can still be safely published.
          # Failed/partial counties are never passed to the persistence script.
          echo "county_search_failures=$failed" >> "$GITHUB_OUTPUT"
      - name: Publish validated results with concurrency-safe retry
        if: always() && github.ref == 'refs/heads/main'
        env:
          COUNTY_SCOPE_INPUT: ${{ inputs.county_scope }}
          CATEGORY_INPUT: ${{ inputs.category }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Rebuild the state from the newest main on every attempt. This avoids
          # overwriting concurrent diary snapshots and gives each failed push a
          # clean retry rather than rebasing conflicting JSON/JSONL changes.
          for attempt in 1 2 3 4 5; do
            echo "Publish attempt $attempt/5"
            git fetch origin main
            git reset --hard origin/main

            # Only persist a county output that exists and passed all source checks.
            if [[ -s action-discovery-results/norrbotten.json ]] && python -c "import json; d=json.load(open('action-discovery-results/norrbotten.json')); assert d.get('request_ok') and d.get('total_reconciled')"; then
              python scripts/persist_lansstyrelsen_diary.py \
                --input action-discovery-results/norrbotten.json \
                --state data/lansstyrelsen-diary/state.json \
                --events data/lansstyrelsen-diary/events.jsonl \
                --summary action-discovery-results/norrbotten-summary.json
            fi
            if [[ -s action-discovery-results/vasterbotten.json ]] && python -c "import json; d=json.load(open('action-discovery-results/vasterbotten.json')); assert d.get('request_ok') and d.get('total_reconciled')"; then
              python scripts/persist_lansstyrelsen_diary.py \
                --input action-discovery-results/vasterbotten.json \
                --state data/lansstyrelsen-diary/state.json \
                --events data/lansstyrelsen-diary/events.jsonl \
                --summary action-discovery-results/vasterbotten-summary.json
            fi

            python scripts/audit_lansstyrelsen_diary_history.py \
              --state data/lansstyrelsen-diary/state.json \
              --events data/lansstyrelsen-diary/events.jsonl \
              --output action-discovery-results/history-audit.json

            git add data/lansstyrelsen-diary/state.json data/lansstyrelsen-diary/events.jsonl data/lansstyrelsen-diary/last-run-summary.json
            if git diff --cached --quiet; then
              echo "No diary changes to publish."
              exit 0
            fi
            git commit -m "Discover Länsstyrelsen A/B action cases"
            if git push origin HEAD:main; then
              echo "Published validated diary results."
              exit 0
            fi
            echo "Push rejected because main moved; retrying from latest main."
            git reset --hard
          done

          echo "Could not publish after five concurrency-safe attempts." >&2
          exit 1
      - name: Upload search results and audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lansstyrelsen-action-discovery
          path: action-discovery-results/
          if-no-files-found: warn
          retention-days: 30
      - name: Verify at least one county search completed
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          files = [
              Path("action-discovery-results/norrbotten.json"),
              Path("action-discovery-results/vasterbotten.json"),
          ]
          valid = []
          for path in files:
              if not path.exists():
                  continue
              try:
                  payload = json.loads(path.read_text(encoding="utf-8"))
              except Exception:
                  continue
              if payload.get("request_ok") and payload.get("total_reconciled"):
                  valid.append(path.name)
          print(f"Validated county searches: {valid}")
          if not valid:
              raise SystemExit("No county search passed source-total and pagination validation.")
          PY
