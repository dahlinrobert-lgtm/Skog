name: Create Skogsstyrelsen raster overview

on:
  workflow_dispatch:
  push:
    paths:
      - "data/skogliga-grunddata/*.zip"
      - "scripts/create_skogliga_grunddata_overview.py"
      - ".github/workflows/create-skogliga-grunddata-overview.yml"

permissions:
  contents: read

jobs:
  overview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install raster dependencies
        run: python -m pip install --disable-pip-version-check numpy rasterio matplotlib

      - name: Create downsampled raster overview
        run: python scripts/create_skogliga_grunddata_overview.py

      - name: Upload overview and report
        uses: actions/upload-artifact@v4
        with:
          name: skogliga-grunddata-raster-overview
          path: |
            data/skogliga-grunddata/raster-overview.png
            data/skogliga-grunddata/raster-overview-report.json
          if-no-files-found: error
          retention-days: 30
