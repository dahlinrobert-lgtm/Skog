name: Weekly Skogsdatalabbet data timeline
on:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * 1"
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: skogsdatalabbet-weekly-timeline
  cancel-in-progress: false
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SKOGSSTYRELSEN_GEODATA_USERNAME: ${{ secrets.SKOGSSTYRELSEN_GEODATA_USERNAME }}
      SKOGSSTYRELSEN_GEODATA_PASSWORD: ${{ secrets.SKOGSSTYRELSEN_GEODATA_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install requests numpy tifffile pyproj
      - name: Test weekly delta logic
        run: python -m unittest discover -s tests -p 'test_geodata_timeline*.py' -v
      - name: Capture weekly baseline or changes
        run: python scripts/geodata_timeline.py
      - name: Create or update geodata timeline snapshot pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ github.token }}
          branch: automation/geodata-timeline-snapshots
          base: main
          delete-branch: true
          add-paths: |
            data/geodata_timeline/
          commit-message: "Archive Skogsdatalabbet geodata timeline snapshot"
          title: "data: update Skogsdatalabbet geodata timeline snapshot"
          body: |
            Automated metadata and raster-sample snapshot for the configured
            Gräsmyr pilot area.

            Review the dated snapshot manifest, latest.json and NPZ samples before
            merging. This workflow monitors the configured pilot sample only; it
            does not establish national coverage or full-source completeness.

            A failed or incomplete run must not be interpreted as missing source
            data. This PR does not change commercial-use, storage, customer-display
            or redistribution rights.
