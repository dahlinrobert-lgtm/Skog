name: Weekly Skogsdatalabbet data timeline
on:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * 1"
permissions:
  contents: write
concurrency:
  group: skogsdatalabbet-weekly-timeline
  cancel-in-progress: false
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SKOGSSTYRELSEN_GEODATA_USERNAME: ${{ secrets.SKOGSSTYRELSEN_GEODATA_USERNAME }}
      SKOGSSTYRELSEN_GEODATA_PASSWORD: ${{ secrets.SKOGSSTYRELSEN_GEODATA_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install requests numpy tifffile pyproj
      - name: Test weekly delta logic
        run: python -m unittest discover -s tests -p 'test_geodata_timeline.py' -v
      - name: Capture weekly baseline or changes
        run: python scripts/geodata_timeline.py
      - name: Commit timeline snapshots and events
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/geodata_timeline
          if ! git diff --cached --quiet; then
            git commit -m "Update weekly Skogsdatalabbet geodata timeline"
            git fetch origin main
            git rebase --strategy-option=theirs origin/main
            git push origin HEAD:main
          fi
