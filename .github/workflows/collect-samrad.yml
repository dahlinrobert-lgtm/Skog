name: Collect Samråd pilot snapshots
on:
  pull_request:
    paths:
      - "scripts/collect_samrad.py"
      - "scripts/build_harvest_event_bundle.py"
      - "tests/test_collect_samrad.py"
      - "tests/test_harvest_event_bundle.py"
      - "data-platform/schemas/event-bundle.schema.json"
      - "data-platform/scripts/validate_event_bundle.py"
      - "config/area.json"
      - "requirements.txt"
      - ".github/workflows/collect-samrad.yml"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/collect_samrad.py"
      - "scripts/build_harvest_event_bundle.py"
      - "tests/test_collect_samrad.py"
      - "tests/test_harvest_event_bundle.py"
      - "data-platform/schemas/event-bundle.schema.json"
      - "data-platform/scripts/validate_event_bundle.py"
      - "config/area.json"
      - "requirements.txt"
      - ".github/workflows/collect-samrad.yml"
  schedule:
    - cron: "27 6 * * *"
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: samrad-pilot-archive
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Test Samråd collector and event-chain integration
        run: |
          python -m unittest discover -s tests -p 'test_collect_samrad.py' -v
          python -m unittest discover -s tests -p 'test_harvest_event_bundle.py' -v
      - name: Collect point, line and polygon layers
        if: github.event_name != 'pull_request'
        run: python scripts/collect_samrad.py
      - name: Build and validate combined harvest event bundle
        if: github.event_name != 'pull_request'
        run: |
          python scripts/build_harvest_event_bundle.py
          mkdir -p docs/data
          cp data/harvest_event_bundle.json docs/data/harvest_event_bundle.json
      - name: Create or update Samråd snapshot pull request
        if: github.event_name != 'pull_request'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ github.token }}
          branch: automation/samrad-pilot-snapshots
          delete-branch: true
          add-paths: |
            data/samrad_latest.json
            data/harvest_event_bundle.json
            docs/data/harvest_event_bundle.json
            data/samrad_snapshots
          commit-message: "Archive Samråd pilot snapshot"
          title: "data: archive Samråd pilot snapshots"
          body: |
            ## Samråd pilot snapshot

            Automated snapshot from the configured pilot area.

            - Point, line and polygon layers were collected and validated by the existing collector.
            - The combined harvest event bundle was built and validated.
            - Immutable dated snapshots and latest manifests are included for review.

            Review collection status, coverage and snapshot contents before merging. Incomplete or failed runs must never be interpreted as removals or completed harvests. This PR does not authorize customer display or notifications.
