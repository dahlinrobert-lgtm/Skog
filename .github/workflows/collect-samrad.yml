name: Collect Samråd pilot snapshots
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/collect_samrad.py"
      - "scripts/build_harvest_event_bundle.py"
      - "tests/test_collect_samrad.py"
      - "tests/test_harvest_event_bundle.py"
      - "data-platform/schemas/event-bundle.schema.json"
      - "data-platform/scripts/validate_event_bundle.py"
      - "config/area.json"
      - "requirements.txt"
      - ".github/workflows/collect-samrad.yml"
  schedule:
    - cron: "27 6 * * *"
permissions:
  contents: write
concurrency:
  group: samrad-pilot-archive
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Test Samråd collector and event-chain integration
        run: |
          python -m unittest discover -s tests -p 'test_collect_samrad.py' -v
          python -m unittest discover -s tests -p 'test_harvest_event_bundle.py' -v
      - name: Collect point, line and polygon layers
        run: python scripts/collect_samrad.py
      - name: Build and validate combined harvest event bundle
        run: |
          python scripts/build_harvest_event_bundle.py
          mkdir -p docs/data
          cp data/harvest_event_bundle.json docs/data/harvest_event_bundle.json
      - name: Publish latest result, event bundle and immutable snapshot
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/samrad_latest.json data/harvest_event_bundle.json docs/data/harvest_event_bundle.json data/samrad_snapshots
          if git diff --cached --quiet; then
            echo "No Samråd changes to publish."
            exit 0
          fi
          git commit -m "Archive Samråd pilot snapshot"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main; then
              if git push origin HEAD:main; then
                exit 0
              fi
              git rebase --abort || true
            else
              git rebase --abort || true
              exit 1
            fi
            sleep $((attempt * 2))
          done
          echo "Could not publish Samråd snapshot after five attempts." >&2
          exit 1
