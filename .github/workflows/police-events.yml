name: Police events archive (Norrbotten)

on:
  workflow_dispatch:
    inputs:
      full:
        description: "Fetch complete available Norrbotten history"
        required: false
        type: boolean
        default: false
  schedule:
    - cron: "41 4 * * *"

permissions:
  contents: write
  id-token: write

concurrency:
  group: skog-police-events
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Prepare isolated raw run segment
        run: |
          echo "POLICE_RAW_SEGMENT=$RUNNER_TEMP/police-raw-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.jsonl" >> "$GITHUB_ENV"
      - name: Fetch police events
        env:
          FULL_HISTORY: ${{ inputs.full }}
        run: |
          if [ "$FULL_HISTORY" = "true" ]; then
            python scripts/ingest_police_events.py --full --raw-output "$POLICE_RAW_SEGMENT"
          else
            python scripts/ingest_police_events.py --max-pages 5 --raw-output "$POLICE_RAW_SEGMENT"
          fi
      - name: Sign in to Azure with GitHub OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Upload and verify immutable raw run segment
        env:
          AZURE_STORAGE_ACCOUNT: stskogkolldata
          POLICE_ARCHIVE_CONTAINER: police-events
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          python scripts/upload_police_events_segment.py \
            --source "$POLICE_RAW_SEGMENT" \
            --run-id "$RUN_ID" \
            --run-attempt "$RUN_ATTEMPT"
      - name: Extract individual wildlife incident candidates
        run: python scripts/extract_police_wildlife_incidents.py
      - name: Build archive quality report
        run: python scripts/report_police_events_quality.py
      - name: Commit archive, candidates and quality report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/police_events/
          if git diff --cached --quiet; then
            echo "No police-event changes"
          else
            git commit -m "Archive Norrbotten police events"
            git push
          fi
