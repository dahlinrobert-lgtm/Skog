name: Police events archive (Norrbotten)

on:
  workflow_dispatch:
    inputs:
      full:
        description: "Fetch complete available Norrbotten history"
        required: false
        type: boolean
        default: false
  schedule:
    - cron: "41 4 * * *"

permissions:
  contents: write

concurrency:
  group: skog-police-events
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Fetch police events
        env:
          FULL_HISTORY: ${{ inputs.full }}
        run: |
          if [ "$FULL_HISTORY" = "true" ]; then
            python scripts/ingest_police_events.py --full
          else
            python scripts/ingest_police_events.py --max-pages 5
          fi
      - name: Extract individual wildlife incident candidates
        run: python scripts/extract_police_wildlife_incidents.py
      - name: Commit archive and wildlife candidates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/police_events/
          if git diff --cached --quiet; then
            echo "No police-event changes"
          else
            git commit -m "Archive Norrbotten police events"
            git push
          fi
