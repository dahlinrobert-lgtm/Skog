name: Trace SCA voluntary layer source configuration

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/trace_sca_voluntary_source.py"
      - ".github/workflows/trace-sca-voluntary-source.yml"

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "requests>=2.31,<3"
      - name: Trace named layer through map source
        run: python scripts/trace_sca_voluntary_source.py
      - name: Validate trace JSON
        run: python -m json.tool sca-voluntary-source-trace.json > /dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: sca-voluntary-source-trace
          path: sca-voluntary-source-trace.json
          if-no-files-found: error
          retention-days: 30
