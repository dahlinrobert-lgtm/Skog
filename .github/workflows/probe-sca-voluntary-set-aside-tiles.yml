name: Probe SCA voluntary set-aside vector tiles

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/probe_sca_voluntary_set_aside_tiles.py"
      - ".github/workflows/probe-sca-voluntary-set-aside-tiles.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install requests
        run: python -m pip install "requests>=2.31,<3"
      - name: Probe four fixed tiles
        run: python scripts/probe_sca_voluntary_set_aside_tiles.py
      - name: Upload diagnostic result
        uses: actions/upload-artifact@v4
        with:
          name: sca-voluntary-set-aside-tile-probe
          path: sca-voluntary-set-aside-tile-probe.json
          if-no-files-found: error
          retention-days: 30
