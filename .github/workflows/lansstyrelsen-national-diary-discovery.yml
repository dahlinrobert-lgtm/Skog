name: Discover Länsstyrelsen national diary groups (diagnostics only)

on:
  workflow_dispatch:
    inputs:
      year:
        description: Registration year
        required: true
        default: "2026"
        type: string
      month:
        description: Registration month (1-12)
        required: true
        default: "10"
        type: string
      county_group:
        description: Three-county group (run one group at a time)
        required: true
        default: group_01
        type: choice
        options:
          - group_01
          - group_02
          - group_03
          - group_04
          - group_05
          - group_06
          - group_07
      category:
        description: Search category used when custom search term is empty
        required: true
        default: B
        type: choice
        options:
          - A
          - B
      search_term:
        description: Optional single diagnostic phrase; overrides category phrases
        required: false
        default: ""
        type: string

# This workflow is deliberately read-only with respect to the repository.
# It never calls the snapshot persistence script and never pushes to main.
permissions:
  contents: read

concurrency:
  group: lansstyrelsen-national-diary-discovery
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install browser dependencies
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Run focused validation tests
        env:
          PYTHONPATH: scripts
        run: |
          python -m unittest \
            scripts.test_lansstyrelsen_diary_validation \
            scripts.test_lansstyrelsen_diary_pagination \
            scripts.test_lansstyrelsen_snapshot_extraction \
            scripts.test_lansstyrelsen_snapshot_persistence \
            scripts.test_lansstyrelsen_monthly_snapshot
      - name: Validate scope and collect selected county group
        env:
          YEAR_INPUT: ${{ inputs.year }}
          MONTH_INPUT: ${{ inputs.month }}
          GROUP_INPUT: ${{ inputs.county_group }}
          CATEGORY_INPUT: ${{ inputs.category }}
          CUSTOM_TERM_INPUT: ${{ inputs.search_term }}
        run: |
          set -euo pipefail
          python - "$YEAR_INPUT" "$MONTH_INPUT" <<'PY'
          import calendar, sys
          year, month = map(int, sys.argv[1:])
          if not 1900 <= year <= 2100 or not 1 <= month <= 12:
              raise SystemExit("Invalid year/month")
          print(f"Validated period: {year:04d}-{month:02d}-01 to {year:04d}-{month:02d}-{calendar.monthrange(year, month)[1]:02d}")
          PY
          mkdir -p national-diary-diagnostics
          case "$GROUP_INPUT" in
            group_01) counties=("Länsstyrelsen i Norrbottens län" "Länsstyrelsen i Västerbottens län" "Länsstyrelsen i Jämtlands län") ;;
            group_02) counties=("Länsstyrelsen i Västernorrlands län" "Länsstyrelsen i Gävleborgs län" "Länsstyrelsen i Dalarnas län") ;;
            group_03) counties=("Länsstyrelsen i Värmlands län" "Länsstyrelsen i Örebro län" "Länsstyrelsen i Västmanlands län") ;;
            group_04) counties=("Länsstyrelsen i Uppsala län" "Länsstyrelsen i Stockholms län" "Länsstyrelsen i Södermanlands län") ;;
            group_05) counties=("Länsstyrelsen i Östergötlands län" "Länsstyrelsen i Jönköpings län" "Länsstyrelsen i Kronobergs län") ;;
            group_06) counties=("Länsstyrelsen i Kalmar län" "Länsstyrelsen i Gotlands län" "Länsstyrelsen i Blekinge län") ;;
            group_07) counties=("Länsstyrelsen i Skåne län" "Länsstyrelsen i Hallands län" "Länsstyrelsen i Västra Götalands län") ;;
            *) echo "Invalid county group" >&2; exit 2 ;;
          esac
          if [[ -n "${CUSTOM_TERM_INPUT//[[:space:]]/}" ]]; then
            custom_term="$(python - "$CUSTOM_TERM_INPUT" <<'PY'
          import sys
          term = sys.argv[1].strip()
          if not 2 <= len(term) <= 80 or any(ord(c) < 32 for c in term):
              raise SystemExit("Custom search term must be 2-80 characters without control characters")
          print(term)
          PY
          )"
            terms=("$custom_term")
            expected=3
            mode="custom_term"
          else
            case "$CATEGORY_INPUT" in
              A) terms=("skogsbilväg" "vägbyggnad" "ledningsdragning" "schaktning" "utfyllnad" "massupplag") ;;
              B) terms=("vattenverksamhet" "markavvattning" "dikesrensning" "trumma" "våtmarksanläggning" "omgrävning av vattendrag") ;;
              *) echo "Invalid category" >&2; exit 2 ;;
            esac
            expected=18
            mode="category"
          fi
          failures=0
          for county_index in "${!counties[@]}"; do
            county="${counties[$county_index]}"
            for term_index in "${!terms[@]}"; do
              term="${terms[$term_index]}"
              outfile="national-diary-diagnostics/county-$county_index-term-$term_index.json"
              echo "Discovering $county / $term / $YEAR_INPUT-$MONTH_INPUT"
              if ! python scripts/collect_lansstyrelsen_monthly_snapshot.py \
                --county "$county" --term "$term" \
                --year "$YEAR_INPUT" --month "$MONTH_INPUT" \
                --output "$outfile"; then
                echo "::warning::Collection did not reconcile: $county / $term"
                failures=$((failures + 1))
              fi
            done
          done
          python - "$GROUP_INPUT" "$CATEGORY_INPUT" "$YEAR_INPUT" "$MONTH_INPUT" "$failures" "$expected" "$mode" <<'PY'
          import json, sys
          from pathlib import Path
          group, category, year, month, process_failures, expected, mode = sys.argv[1:]
          expected = int(expected)
          files = sorted(Path("national-diary-diagnostics").glob("*.json"))
          rows = []
          for path in files:
              try:
                  run = json.loads(path.read_text(encoding="utf-8"))
                  interval = (run.get("intervals") or [{}])[0]
                  ok = bool(interval.get("reconciled")) and not interval.get("error")
                  rows.append({
                      "file": path.name, "county": run.get("county"),
                      "term": run.get("search_term"), "source_total": interval.get("source_total"),
                      "extracted_unique_ids": interval.get("extracted_unique_ids"),
                      "pager_complete": interval.get("pager_complete"),
                      "reconciled": ok, "error": interval.get("error"),
                  })
              except Exception as exc:
                  rows.append({"file": path.name, "reconciled": False, "error": str(exc)})
          report = {
              "mode": "diagnostics_only_no_persistence",
              "search_mode": mode,
              "county_group": group, "category": category,
              "registration_period": f"{year}-{int(month):02d}",
              "expected_intervals": expected, "observed_files": len(files),
              "reconciled_intervals": sum(bool(x.get("reconciled")) for x in rows),
              "failed_intervals": [x for x in rows if not x.get("reconciled")],
              "process_failures": int(process_failures), "intervals": rows,
          }
          Path("national-diary-diagnostics/summary.json").write_text(
              json.dumps(report, ensure_ascii=False, indent=2) + "\n", encoding="utf-8"
          )
          print(json.dumps(report, ensure_ascii=False, indent=2))
          if len(files) != expected or report["reconciled_intervals"] != expected or int(process_failures):
              raise SystemExit("Group is incomplete; diagnostics retained as artifact only.")
          PY
      - name: Upload diagnostics (no snapshot publication)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lansstyrelsen-national-${{ inputs.county_group }}-${{ inputs.category }}-${{ inputs.year }}-${{ inputs.month }}
          path: national-diary-diagnostics/
          if-no-files-found: warn
          retention-days: 30
