name: Search Länsstyrelsen public diary

on:
  workflow_dispatch:
    inputs:
      county:
        description: Public diary label
        required: true
        default: "Länsstyrelsen i Västra Götalands län"
        type: choice
        options:
          - "Länsstyrelsen i Västra Götalands län"
          - "Länsstyrelsen i Norrbottens län"
          - "Länsstyrelsen i Västerbottens län"
          - "Alla län"
      search_term:
        description: Phrase searched in case title
        required: true
        default: "naturvårdsbränning"
        type: string
  push:
    paths:
      - "scripts/search_lansstyrelsen_diary.py"
      - ".github/workflows/lansstyrelsen-diary-search.yml"

permissions:
  contents: read

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install browser dependencies
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Submit one public diary search in Chromium
        env:
          COUNTY_INPUT: ${{ inputs.county }}
          SEARCH_TERM_INPUT: ${{ inputs.search_term }}
        run: |
          county="${COUNTY_INPUT:-Länsstyrelsen i Västra Götalands län}"
          search_term="${SEARCH_TERM_INPUT:-naturvårdsbränning}"
          python scripts/search_lansstyrelsen_diary_browser.py \
            --county "$county" \
            --search-term "$search_term" \
            --output diary-search.json
      - name: Upload public search results
        uses: actions/upload-artifact@v4
        with:
          name: lansstyrelsen-diary-search
          path: diary-search.json
          if-no-files-found: error
          retention-days: 30
