name: Search Länsstyrelsen public diary

on:
  workflow_dispatch:
    inputs:
      county:
        description: Public diary label
        required: true
        default: "Länsstyrelsen i Västra Götalands län"
        type: choice
        options:
          - "Länsstyrelsen i Västra Götalands län"
          - "Länsstyrelsen i Norrbottens län"
          - "Länsstyrelsen i Västerbottens län"
          - "Alla län"
      confirm_all_counties:
        description: Set true to run an intentional all-county coverage check
        required: false
        default: false
        type: boolean
      search_term:
        description: Phrase searched in case title
        required: true
        default: "naturvårdsbränning"
        type: string
      search_terms:
        description: Optional newline- or comma-separated extra phrases; each is searched separately
        required: false
        default: ""
        type: string
  schedule:
    # Refresh all county diaries daily; stagger away from the top of the hour.
    - cron: "17 4 * * *"
  push:
    branches:
      - main
    paths:
      - "scripts/search_lansstyrelsen_diary.py"
      - "scripts/search_lansstyrelsen_diary_browser.py"
      - "scripts/persist_lansstyrelsen_diary.py"
      - "scripts/test_persist_lansstyrelsen_diary.py"
      - "scripts/audit_lansstyrelsen_diary_history.py"
      - "scripts/test_audit_lansstyrelsen_diary_history.py"
      - ".github/workflows/lansstyrelsen-diary-search.yml"

permissions:
  contents: write

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test diary history and source-response validation
        run: python -m unittest scripts.test_persist_lansstyrelsen_diary scripts.test_lansstyrelsen_diary_validation scripts.test_audit_lansstyrelsen_diary_history scripts.test_diary_county_coverage
      - name: Audit persisted diary history
        run: |
          python scripts/audit_lansstyrelsen_diary_history.py \
            --state data/lansstyrelsen-diary/state.json \
            --events data/lansstyrelsen-diary/events.jsonl \
            --output diary-history-audit.json
      - name: Install browser dependencies
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Submit public diary search in Chromium
        env:
          COUNTY_INPUT: ${{ inputs.county }}
          CONFIRM_ALL_COUNTIES_INPUT: ${{ inputs.confirm_all_counties }}
          SEARCH_TERM_INPUT: ${{ inputs.search_term }}
          SEARCH_TERMS_INPUT: ${{ inputs.search_terms }}
        run: |
          county="${COUNTY_INPUT:-Länsstyrelsen i Västra Götalands län}"
          if [ "${GITHUB_EVENT_NAME:-}" = "schedule" ] || [ "${CONFIRM_ALL_COUNTIES_INPUT:-false}" = "true" ]; then
            county="Alla län"
          fi
          search_term="${SEARCH_TERM_INPUT:-naturvårdsbränning}"
          extra_terms="${SEARCH_TERMS_INPUT:-}"
          python scripts/search_lansstyrelsen_diary_browser.py \
            --county "$county" \
            --search-term "$search_term" \
            --extra-search-terms "$extra_terms" \
            --output diary-search.json
      - name: Persist validated result rows
        if: success()
        run: |
          python scripts/persist_lansstyrelsen_diary.py \
            --input diary-search.json \
            --state data/lansstyrelsen-diary/state.json \
            --events data/lansstyrelsen-diary/events.jsonl \
            --summary data/lansstyrelsen-diary/last-run-summary.json
      - name: Print structured result summary
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("diary-search.json")
          if not p.exists():
              print("No diary-search.json was produced")
              raise SystemExit(0)
          data = json.loads(p.read_text(encoding="utf-8"))
          print(json.dumps({
              "request_ok": data.get("request_ok"),
              "county": data.get("requested_county"),
              "expected_county_count": data.get("expected_county_count"),
              "completed_counties": data.get("completed_counties"),
              "failed_counties": data.get("failed_counties"),
              "county_coverage_ok": data.get("county_coverage_ok"),
              "search_term": data.get("search_term"),
              "result_count": data.get("result_count"),
              "visible_case_count_hint": data.get("visible_case_count_hint"),
              "error": data.get("error"),
              "sample_results": data.get("results", [])[:10],
              "table_diagnostics": data.get("table_diagnostics", [])[:12],
          }, ensure_ascii=False, indent=2))
          PY
      - name: Publish validated diary history with concurrency-safe retry
        if: success() && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            # Rebuild the state against the latest main instead of rebasing generated
            # JSON snapshots, which can conflict when two diary searches finish together.
            git fetch origin main
            git reset --hard origin/main
            python scripts/persist_lansstyrelsen_diary.py \
              --input diary-search.json \
              --state data/lansstyrelsen-diary/state.json \
              --events data/lansstyrelsen-diary/events.jsonl \
              --summary data/lansstyrelsen-diary/last-run-summary.json
            # Audit the exact latest-main-derived files that this attempt will publish.
            python scripts/audit_lansstyrelsen_diary_history.py \
              --state data/lansstyrelsen-diary/state.json \
              --events data/lansstyrelsen-diary/events.jsonl \
              --output diary-history-audit.json
            git add data/lansstyrelsen-diary/
            if git diff --cached --quiet; then
              echo "Diary history unchanged."
              exit 0
            fi
            git commit -m "Update Länsstyrelsen diary history"
            if git push origin HEAD:main; then
              echo "Published validated diary history."
              exit 0
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "Could not publish diary history after five attempts." >&2
              exit 1
            fi
            sleep 2
          done
      - name: Upload public search results, history summary and audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lansstyrelsen-diary-search
          path: |
            diary-search.json
            diary-history-audit.json
            data/lansstyrelsen-diary/last-run-summary.json
          if-no-files-found: warn
          retention-days: 30
