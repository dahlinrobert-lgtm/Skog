name: Search Länsstyrelsen public diary

on:
  workflow_dispatch:
    inputs:
      county:
        description: Public diary label
        required: true
        default: "Länsstyrelsen i Västra Götalands län"
        type: choice
        options:
          - "Länsstyrelsen i Västra Götalands län"
          - "Länsstyrelsen i Norrbottens län"
          - "Länsstyrelsen i Västerbottens län"
          - "Alla län"
      search_term:
        description: Phrase searched in case title
        required: true
        default: "naturvårdsbränning"
        type: string
  push:
    paths:
      - "scripts/search_lansstyrelsen_diary.py"
      - "scripts/search_lansstyrelsen_diary_browser.py"
      - "scripts/persist_lansstyrelsen_diary.py"
      - "scripts/test_persist_lansstyrelsen_diary.py"
      - ".github/workflows/lansstyrelsen-diary-search.yml"

permissions:
  contents: write

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test diary history persistence core
        run: python -m unittest scripts/test_persist_lansstyrelsen_diary.py
      - name: Install browser dependencies
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Submit one public diary search in Chromium
        env:
          COUNTY_INPUT: ${{ inputs.county }}
          SEARCH_TERM_INPUT: ${{ inputs.search_term }}
        run: |
          county="${COUNTY_INPUT:-Länsstyrelsen i Västra Götalands län}"
          search_term="${SEARCH_TERM_INPUT:-naturvårdsbränning}"
          python scripts/search_lansstyrelsen_diary_browser.py \
            --county "$county" \
            --search-term "$search_term" \
            --output diary-search.json
      - name: Persist validated result rows
        if: success()
        run: |
          python scripts/persist_lansstyrelsen_diary.py \
            --input diary-search.json \
            --state data/lansstyrelsen-diary/state.json \
            --events data/lansstyrelsen-diary/events.jsonl \
            --summary data/lansstyrelsen-diary/last-run-summary.json
      - name: Print structured result summary
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("diary-search.json")
          if not p.exists():
              print("No diary-search.json was produced")
              raise SystemExit(0)
          data = json.loads(p.read_text(encoding="utf-8"))
          print(json.dumps({
              "request_ok": data.get("request_ok"),
              "county": data.get("requested_county"),
              "search_term": data.get("search_term"),
              "result_count": data.get("result_count"),
              "visible_case_count_hint": data.get("visible_case_count_hint"),
              "error": data.get("error"),
              "sample_results": data.get("results", [])[:10],
              "table_diagnostics": data.get("table_diagnostics", [])[:12],
          }, ensure_ascii=False, indent=2))
          PY
      - name: Commit validated diary history
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/lansstyrelsen-diary/
          if git diff --cached --quiet; then
            echo "Diary history unchanged."
          else
            git commit -m "Update Länsstyrelsen diary history"
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                echo "Published validated diary history."
                break
              fi
              if [ "$attempt" -eq 5 ]; then
                echo "Could not publish diary history after five attempts." >&2
                exit 1
              fi
              sleep 2
            done
          fi
      - name: Upload public search results and history summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lansstyrelsen-diary-search
          path: |
            diary-search.json
            data/lansstyrelsen-diary/last-run-summary.json
          if-no-files-found: warn
          retention-days: 30
