name: Inspect SCA voluntary multiscale geometries
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/inspect_sca_voluntary_multiscale_geometry.py"
      - ".github/workflows/inspect-sca-voluntary-multiscale-geometry.yml"
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install MVT and geometry libraries
        run: python -m pip install "requests>=2.31,<3" "mapbox-vector-tile>=2,<3" "shapely>=2,<3"
      - name: Compile
        run: python -m py_compile scripts/inspect_sca_voluntary_multiscale_geometry.py
      - name: Inspect bounded polygon tiles
        run: python scripts/inspect_sca_voluntary_multiscale_geometry.py
      - name: Validate report
        run: python -m json.tool sca-voluntary-multiscale-geometry.json > /dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: sca-voluntary-multiscale-geometry
          path: sca-voluntary-multiscale-geometry.json
          if-no-files-found: error
          retention-days: 30
