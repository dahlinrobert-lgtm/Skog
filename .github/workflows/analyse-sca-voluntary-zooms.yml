name: Analyse SCA voluntary set-aside zoom levels

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/analyse_sca_voluntary_zooms.py"
      - ".github/workflows/analyse-sca-voluntary-zooms.yml"

permissions:
  contents: read

jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install MVT decoder
        run: python -m pip install "requests>=2.31,<3" "mapbox-vector-tile>=2,<3"
      - name: Compare zoom levels
        run: python scripts/analyse_sca_voluntary_zooms.py
      - name: Validate report JSON
        run: python -m json.tool sca-voluntary-zoom-analysis.json > /dev/null
      - name: Upload zoom analysis
        uses: actions/upload-artifact@v4
        with:
          name: sca-voluntary-zoom-analysis
          path: sca-voluntary-zoom-analysis.json
          if-no-files-found: error
          retention-days: 30
