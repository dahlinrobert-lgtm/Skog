name: Probe Länsstyrelsen diary form

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install browser dependencies
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Inspect public diary form (read-only)
        run: python scripts/probe_lansstyrelsen_diary_form.py
      - name: Upload form diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lansstyrelsen-diary-form-probe
          path: lansstyrelsen-form-probe.json
          if-no-files-found: error
          retention-days: 14
