name: Refresh SCA national discovery snapshot

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 1 * *"

permissions:
  contents: write

concurrency:
  group: sca-national-discovery
  cancel-in-progress: false

jobs:
  discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install MVT dependencies and test runner
        run: python -m pip install "requests>=2.31,<3" "mapbox-vector-tile>=2,<3" "shapely>=2,<3" pytest
      - name: Run census and audit regression tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m pytest -q tests/test_sca_national_independent_layer_census.py
          python -m pytest -q tests/test_monitor_sca_voluntary_tiles.py
          python -m pytest -q tests/test_sca_parent_child_geometry_overlap.py
          python -m pytest -q tests/test_sca_cluster_point_targeted_probes.py
          python -m pytest -q tests/test_sca_neighbour_point_correspondence.py
      - name: Refresh independent national z9 seed census
        run: |
          python -m py_compile scripts/sca_national_independent_layer_census_z9.py
          python scripts/sca_national_independent_layer_census_z9.py --out output/sca-national-independent-layer-census-z9.json --workers 4
      - name: Audit sampled z8-z12 tile coverage
        run: |
          python -m py_compile scripts/audit_sca_tile_coverage.py
          python scripts/audit_sca_tile_coverage.py \
            --census output/sca-national-independent-layer-census-z9.json \
            --out output/sca-multizoom-coverage-audit.json \
            --samples-per-class 8 \
            --no-positive-404-samples 8 \
            --near-positive-404-samples 4 \
            --ownership-positive-404-samples 9 \
            --workers 2
      - name: Audit z8 parent geometry overlap with z9 404 children
        run: |
          python -m py_compile scripts/audit_sca_parent_child_geometry_overlap.py
          python scripts/audit_sca_parent_child_geometry_overlap.py \
            --audit output/sca-multizoom-coverage-audit.json \
            --out output/sca-parent-child-geometry-overlap.json
      - name: Probe MVT neighbourhoods around parent point clusters
        run: |
          python -m py_compile scripts/audit_sca_cluster_point_targeted_probes.py
          python scripts/audit_sca_cluster_point_targeted_probes.py \
            --overlap output/sca-parent-child-geometry-overlap.json \
            --out output/sca-cluster-point-targeted-probes.json \
            --workers 4
      - name: Compare parent cluster points with positive z9 neighbours
        run: |
          python -m py_compile scripts/audit_sca_neighbour_point_correspondence.py
          python scripts/audit_sca_neighbour_point_correspondence.py \
            --input output/sca-cluster-point-targeted-probes.json \
            --out output/sca-neighbour-point-correspondence.json \
            --workers 4
      - name: Validate complete discovery snapshot
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          census = json.loads(Path("output/sca-national-independent-layer-census-z9.json").read_text())
          audit = json.loads(Path("output/sca-multizoom-coverage-audit.json").read_text())
          assert census["summary"]["tiles_completed"] == census["summary"]["tiles_in_bbox"]
          assert audit.get("schema_version") == 1 and audit.get("probe_results")
          for name in ("sca-parent-child-geometry-overlap", "sca-cluster-point-targeted-probes", "sca-neighbour-point-correspondence"):
              json.loads(Path(f"output/{name}.json").read_text())
          print(json.dumps({"generated_at": census["generated_at"], "census_tiles": census["summary"]["tiles_completed"], "multizoom_probe_tiles": len(audit["probe_results"])}, indent=2))
          PY
      - name: Persist latest discovery snapshot
        run: |
          mkdir -p data/sca/discovery
          cp output/sca-national-independent-layer-census-z9.json data/sca/discovery/sca-national-independent-layer-census-z9.json
          cp output/sca-multizoom-coverage-audit.json data/sca/discovery/sca-multizoom-coverage-audit.json
          cp output/sca-parent-child-geometry-overlap.json data/sca/discovery/sca-parent-child-geometry-overlap.json
          cp output/sca-cluster-point-targeted-probes.json data/sca/discovery/sca-cluster-point-targeted-probes.json
          cp output/sca-neighbour-point-correspondence.json data/sca/discovery/sca-neighbour-point-correspondence.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sca/discovery/
          if ! git diff --cached --quiet; then
            git commit -m "Refresh SCA national discovery snapshot"
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              if git rebase origin/main; then
                if git push origin HEAD:main; then
                  echo "SCA discovery snapshot persisted successfully."
                  break
                fi
              fi
              git rebase --abort || true
              if [ "$attempt" -eq 5 ]; then
                echo "Could not persist SCA discovery snapshot after five safe retries." >&2
                exit 1
              fi
              sleep $((attempt * 5))
            done
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: sca-national-discovery-snapshot
          path: |
            output/sca-national-independent-layer-census-z9.json
            output/sca-multizoom-coverage-audit.json
            output/sca-parent-child-geometry-overlap.json
            output/sca-cluster-point-targeted-probes.json
            output/sca-neighbour-point-correspondence.json
          if-no-files-found: error
          retention-days: 90
