name: Skogskoll database tests
on:
  push:
    branches: [main]
    paths:
      - "skogskoll/db/**"
      - "skogskoll/INGESTION.md"
      - ".github/workflows/skogskoll-db-test.yml"
  pull_request:
    paths:
      - "skogskoll/db/**"
      - "skogskoll/INGESTION.md"
      - ".github/workflows/skogskoll-db-test.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  postgis-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: skogskoll_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d skogskoll_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: skogskoll_test
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Create minimal Supabase-compatible auth roles
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          create role anon nologin;
          create role authenticated nologin;
          create role service_role nologin bypassrls;
          create schema auth;
          create table auth.users (id uuid primary key);
          create function auth.uid() returns uuid language sql stable as $$
            select nullif(current_setting('request.jwt.claim.sub', true), '')::uuid
          $$;
          SQL
      - name: Apply schema and migrations
        run: |
          psql -v ON_ERROR_STOP=1 -f skogskoll/db/schema.sql
          psql -v ON_ERROR_STOP=1 -f skogskoll/db/migrations/002_observation_history.sql
          psql -v ON_ERROR_STOP=1 -f skogskoll/db/migrations/003_atomic_page_commit.sql
          psql -v ON_ERROR_STOP=1 -f skogskoll/db/migrations/004_watch_area_matching.sql
      - name: Run PostGIS matching integration test
        run: psql -v ON_ERROR_STOP=1 -f skogskoll/db/tests/watch-area-matching.sql
      - name: Run transactional ingestion smoke test
        run: psql -v ON_ERROR_STOP=1 -f skogskoll/db/tests/smoke-atomic-ingestion.sql
  static-sql-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check SQL test assertions and migration guardrails
        run: |
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const migration = readFileSync("skogskoll/db/migrations/003_atomic_page_commit.sql", "utf8");
            const matching = readFileSync("skogskoll/db/migrations/004_watch_area_matching.sql", "utf8");
            const smoke = readFileSync("skogskoll/db/tests/smoke-atomic-ingestion.sql", "utf8");
            const matchTest = readFileSync("skogskoll/db/tests/watch-area-matching.sql", "utf8");
            const requiredFns = ["skogskoll_start_scan", "skogskoll_commit_page", "skogskoll_finish_scan", "skogskoll_recover_stale_scan"];
            for (const name of requiredFns) {
              if (!migration.includes("create or replace function public." + name)) throw new Error("Migration missing " + name);
              if (!smoke.includes(name)) throw new Error("Smoke test does not exercise " + name);
            }
            if (!matching.includes("st_dwithin") || !matching.includes("st_intersects") || !matching.includes("security definer")) throw new Error("PostGIS matcher missing required predicates/security");
            for (const assertion of ["radius match expected 2", "polygon match expected 2", "disabled watch area must return no matches"]) {
              if (!matchTest.includes(assertion)) throw new Error("Matching integration test missing assertion: " + assertion);
            }
            if (!smoke.includes("begin;") || !smoke.trimEnd().endsWith("rollback;") || !matchTest.includes("begin;") || !matchTest.trimEnd().endsWith("rollback;")) throw new Error("SQL tests must be wrapped in transaction + rollback");
            console.log("Static database guardrails passed.");
          '
