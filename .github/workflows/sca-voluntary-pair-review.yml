name: SCA voluntary polygon pair review
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/review_sca_voluntary_pairs.py"
      - ".github/workflows/sca-voluntary-pair-review.yml"
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install MVT and geometry libraries
        run: python -m pip install "requests>=2.31,<3" "mapbox-vector-tile>=2,<3" "shapely>=2,<3"
      - name: Compile
        run: python -m py_compile scripts/review_sca_voluntary_pairs.py
      - name: Build pair review package
        run: python scripts/review_sca_voluntary_pairs.py
      - name: Validate JSON
        run: python -m json.tool sca-voluntary-pair-review.json > /dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: sca-voluntary-pair-review
          path: sca-voluntary-pair-review.json
          if-no-files-found: error
          retention-days: 30
