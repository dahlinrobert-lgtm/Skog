name: Archive Life2Taiga nature-conservation measures

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/archive_lifetaiga_naturvardsatgarder.py"
      - "tests/test_lifetaiga_naturvardsatgarder_archive.py"
      - ".github/workflows/lifetaiga-naturvardsatgarder-archive.yml"
      - "docs/data/nature-conservation-measures.md"
  schedule:
    - cron: "52 6 * * *"

permissions:
  contents: write

concurrency:
  group: lifetaiga-nature-conservation-archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test archive logic
        run: python -m unittest discover -s tests -p 'test_lifetaiga_naturvardsatgarder_archive.py' -v
      - name: Collect and validate Life2Taiga polygons
        run: python scripts/archive_lifetaiga_naturvardsatgarder.py
      - name: Publish snapshot and change history
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/lifetaiga-naturvardsatgarder/
          if git diff --cached --quiet; then
            echo "No Life2Taiga source changes."
            exit 0
          fi
          git commit -m "Archive Life2Taiga nature-conservation measures"
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              echo "Published Life2Taiga archive."
              exit 0
            fi
            echo "Push rejected because main moved; retrying $attempt/3."
          done
          echo "Could not publish after three attempts." >&2
          exit 1
      - name: Upload collection report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lifetaiga-nature-conservation-report
          path: data/lifetaiga-naturvardsatgarder/latest-report.json
          if-no-files-found: warn
          retention-days: 30
