name: Archive Life2Taiga nature-conservation measures

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/archive_lifetaiga_naturvardsatgarder.py"
      - "tests/test_lifetaiga_naturvardsatgarder_archive.py"
      - ".github/workflows/lifetaiga-naturvardsatgarder-archive.yml"
      - "docs/data/nature-conservation-measures.md"
  schedule:
    - cron: "52 6 * * *"
  push:
    branches: [main]
    paths:
      - "scripts/archive_lifetaiga_naturvardsatgarder.py"
      - "tests/test_lifetaiga_naturvardsatgarder_archive.py"
      - ".github/workflows/lifetaiga-naturvardsatgarder-archive.yml"
      - "docs/data/nature-conservation-measures.md"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: lifetaiga-nature-conservation-archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test archive logic
        run: python -m unittest discover -s tests -p 'test_lifetaiga_naturvardsatgarder_archive.py' -v
      - name: Collect and validate Life2Taiga polygons
        run: python scripts/archive_lifetaiga_naturvardsatgarder.py
      - name: Create or update Life2Taiga archive data pull request
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ github.token }}
          branch: automation/lifetaiga-naturvardsatgarder-archive
          delete-branch: true
          add-paths: |
            data/lifetaiga-naturvardsatgarder/
          commit-message: "Archive Life2Taiga nature-conservation measures"
          title: "data: archive Life2Taiga nature-conservation measures"
          body: |
            ## Life2Taiga historical archive update

            Automated archive snapshot and change-history output.

            - Archive logic tests passed before collection.
            - The collector validates source data before publication.
            - Review the dated snapshots, latest report and history changes before merging.

            Failed or incomplete collection must never be interpreted as removal. This PR does not change source licensing decisions or authorize customer display.
      - name: Upload collection report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lifetaiga-nature-conservation-report
          path: data/lifetaiga-naturvardsatgarder/latest-report.json
          if-no-files-found: warn
          retention-days: 30
