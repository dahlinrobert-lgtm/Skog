name: Gräsmyr monitoring
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/**"
      - "requirements.txt"
      - ".github/workflows/monitor.yml"
  schedule:
    - cron: "17 5 * * *"
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: grasmyr-monitor-${{ github.ref }}
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python scripts/monitor.py
      - name: Build lightweight web dataset
        run: python scripts/build_web_data.py
      - name: Snapshot completed-harvest polygons
        run: python scripts/snapshot_completed.py
      - name: Maintain historical notification register
        run: python scripts/notification_history.py
      - name: Analyze planned and completed changes
        run: python scripts/analyze_changes.py
      - name: Build canonical planned-harvest event bundle
        run: |
          python scripts/build_harvest_event_bundle.py
          mkdir -p docs/data
          cp data/harvest_event_bundle.json docs/data/harvest_event_bundle.json
      - name: Create or update snapshot pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/grasmyr-monitor-snapshot
          delete-branch: true
          add-paths: |
            data/latest.json
            data/latest_web.json
            data/scene_index.json
            data/completed_latest.json
            data/change_analysis.json
            data/notification_history.json
            data/notification_history_events.jsonl
            data/harvest_event_bundle.json
            docs/data/harvest_event_bundle.json
            data/snapshots
          commit-message: "Update Gräsmyr monitoring snapshot"
          title: "data: update Gräsmyr monitoring snapshot"
          body: |
            Automated Gräsmyr monitoring output.
            Review snapshot changes and historical event updates before merging.
          labels: automated, data
