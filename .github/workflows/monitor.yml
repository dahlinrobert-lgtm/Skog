name: Gräsmyr monitoring
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/**"
      - "requirements.txt"
      - ".github/workflows/monitor.yml"
  schedule:
    - cron: "17 5 * * *"
permissions:
  contents: write
concurrency:
  group: grasmyr-monitor-${{ github.ref }}
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python scripts/monitor.py
      - name: Snapshot completed-harvest polygons
        run: python scripts/snapshot_completed.py
      - name: Analyze planned and completed changes
        run: python scripts/analyze_changes.py
      - name: Commit dated snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest.json data/scene_index.json data/completed_latest.json data/change_analysis.json data/snapshots
          if ! git diff --cached --quiet; then
            git commit -m "Update Gräsmyr monitoring snapshot"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
