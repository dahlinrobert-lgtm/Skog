name: Harvest notification completeness validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/snapshot_harvest_notifications_pilot.py"
      - "tests/test_snapshot_harvest_notifications_pilot.py"
      - ".github/workflows/skogsstyrelsen-complete-harvest-pilot.yml"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: harvest-notification-completeness-validation
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install requests
        run: python -m pip install requests
      - name: Test complete-scan safeguards
        run: python -m unittest tests.test_snapshot_harvest_notifications_pilot -v
      - name: Capture complete snapshot for completeness validation
        if: github.event_name == 'workflow_dispatch'
        run: python scripts/snapshot_harvest_notifications_pilot.py
      - name: Upload snapshot report
        if: always() && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: harvest-notification-completeness-validation-${{ github.run_id }}
          path: data/skogsstyrelsen/harvest_notifications/grasmyr/
          if-no-files-found: warn
          retention-days: 90
      - name: Create or update data pull request
        if: github.event_name == 'workflow_dispatch'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ github.token }}
          branch: automation/harvest-notification-completeness-validation
          delete-branch: true
          add-paths: |
            data/skogsstyrelsen/harvest_notifications/grasmyr/
          commit-message: "Archive harvest-notification completeness snapshot"
          title: "data: archive harvest-notification completeness snapshot"
          body: |
            Complete read-only snapshot for completeness and comparability validation before wider scaling.
            Geographic test scope: Gräsmyr, 10 km radius. This is a bounded validation area,
            not national coverage. Review the manifest, count reconciliation, stable ID inventory
            and SHA-256 before merge. No alerts or customer database writes are performed.
            A failed/partial scan does not write a latest manifest and must never be interpreted as removals.
