name: Audit matched Omdrev 1-3 volume rasters

on:
  workflow_dispatch:
    inputs:
      raster_codes:
        description: Identical tile codes to inspect
        required: true
        default: "12,21,23"
        type: string

permissions:
  contents: read

concurrency:
  group: omdrev-cross-round-raster-audit
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      RASTER_ROUNDS: "1,2,3"
      RASTER_CODES: ${{ inputs.raster_codes || '12,21,23' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install raster inspection dependencies
        run: python -m pip install requests rasterio
      - name: Download matched volume rasters from OneDrive
        env:
          ONEDRIVE_CLIENT_ID: ${{ secrets.ONEDRIVE_CLIENT_ID }}
          ONEDRIVE_REFRESH_TOKEN: ${{ secrets.ONEDRIVE_REFRESH_TOKEN }}
        run: python scripts/download_omdrev_cross_round_pilot.py
      - name: Inspect GeoTIFF metadata and compare grids
        run: python scripts/inspect_omdrev_cross_round_rasters.py
      - name: Upload raster manifest and grid audit
        uses: actions/upload-artifact@v4
        with:
          name: omdrev-cross-round-volume-raster-audit
          path: raster-three-omdrev/cross_round_pilot/
          if-no-files-found: error
          retention-days: 30
