name: Validate Skogsstyrelsen volume rasters

on:
  workflow_dispatch:
  push:
    paths:
      - "data/skogliga-grunddata/*.zip"
      - "scripts/validate_skogliga_grunddata.py"
      - ".github/workflows/validate-skogliga-grunddata.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install raster reader
        run: python -m pip install --upgrade pip rasterio
      - name: Validate ZIP files and raster metadata
        run: python scripts/validate_skogliga_grunddata.py
      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skogliga-grunddata-validation-report
          path: data/skogliga-grunddata/validation-report.json
          if-no-files-found: warn
          retention-days: 30
