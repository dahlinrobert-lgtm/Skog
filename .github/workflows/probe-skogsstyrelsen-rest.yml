name: Probe Skogsstyrelsen raster REST

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/probe_skogsstyrelsen_rest.py"
      - ".github/workflows/probe-skogsstyrelsen-rest.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade pip requests rasterio
      - name: Probe service and export a small raster
        id: probe
        continue-on-error: true
        run: python scripts/probe_skogsstyrelsen_rest.py
      - name: Upload REST probe report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skogsstyrelsen-rest-probe-report
          path: data/skogliga-grunddata/rest-probe-report.json
          if-no-files-found: warn
          retention-days: 30
