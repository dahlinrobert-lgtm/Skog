name: Inspect Skogsindustrierna map request construction
on:
  push:
    branches: [investigate/**]
    paths:
      - "scripts/inspect_skogsindustrierna_request_flow.py"
      - ".github/workflows/inspect-skogsindustrierna-request-flow.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "requests>=2.31,<3"
      - run: python scripts/inspect_skogsindustrierna_request_flow.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: skogsindustrierna-request-flow
          path: artifacts/skogsindustrierna-request-flow.json
          retention-days: 30
