name: Probe Trafikverket national news feed from 2024

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/probe_trafikverket_news_archive.py"
      - "tests/test_probe_trafikverket_news_archive.py"
      - ".github/workflows/trafikverket-news-archive-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test archive parser
        run: python -m unittest discover -s tests -p 'test_probe_trafikverket_news_archive.py' -v
      - name: Inspect public archive and sitemap discovery
        run: python scripts/probe_trafikverket_news_archive.py
      - name: Upload discovery report
        uses: actions/upload-artifact@v4
        with:
          name: trafikverket-national-news-from-2024-${{ github.run_id }}
          path: artifacts/trafikverket-news-archive-probe.json
          if-no-files-found: error
          retention-days: 30
