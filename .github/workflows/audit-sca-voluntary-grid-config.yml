name: Audit SCA voluntary set-aside online grid config

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/audit_sca_voluntary_grid_config.py"
      - ".github/workflows/audit-sca-voluntary-grid-config.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install requests
        run: python -m pip install "requests>=2.31,<3"
      - name: Inspect public online map configuration
        run: python scripts/audit_sca_voluntary_grid_config.py
      - name: Validate JSON
        run: python -m json.tool sca-voluntary-grid-config-audit.json > /dev/null
      - name: Upload audit
        uses: actions/upload-artifact@v4
        with:
          name: sca-voluntary-grid-config-audit
          path: sca-voluntary-grid-config-audit.json
          if-no-files-found: error
          retention-days: 30
