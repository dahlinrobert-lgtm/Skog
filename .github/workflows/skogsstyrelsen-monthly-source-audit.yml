name: Skogsstyrelsen monthly source audit

on:
  workflow_dispatch:
  schedule:
    - cron: "17 7 1 * *"

permissions:
  contents: write

concurrency:
  group: skogsstyrelsen-monthly-source-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Test Samråd collector and completed snapshot archive
        run: |
          python -m unittest discover -s tests -p 'test_collect_samrad.py' -v
          python -m unittest discover -s tests -p 'test_completed_snapshot_store.py' -v
      - name: Collect complete Samråd pilot layers
        run: python scripts/collect_samrad.py
      - name: Snapshot completed-harvest pilot layer
        run: python scripts/snapshot_completed.py
      - name: Probe planned-harvest notification service
        run: node skogskoll/scripts/probe-source.mjs
      - name: Publish immutable monthly snapshots and current manifests
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/samrad_latest.json data/samrad_snapshots data/completed_latest.json data/snapshots
          if git diff --cached --quiet; then
            echo "No source snapshot changes to publish."
            exit 0
          fi
          git commit -m "Archive monthly Skogsstyrelsen source audit"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main; then
              if git push origin HEAD:main; then
                exit 0
              fi
              git rebase --abort || true
            else
              git rebase --abort || true
              exit 1
            fi
            sleep $((attempt * 2))
          done
          echo "Could not publish monthly source snapshots after five attempts." >&2
          exit 1
      - name: Upload planned-harvest probe report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skogsstyrelsen-monthly-source-audit-${{ github.run_id }}
          path: skogskoll/reports/source-probe-latest.json
          if-no-files-found: warn
          retention-days: 90
