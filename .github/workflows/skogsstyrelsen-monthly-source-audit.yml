name: Skogsstyrelsen monthly source audit

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/skogsstyrelsen-monthly-source-audit.yml"
      - "scripts/collect_samrad.py"
      - "scripts/snapshot_completed.py"
      - "scripts/completed_snapshot_store.py"
      - "skogskoll/scripts/probe-source.mjs"
      - "tests/test_collect_samrad.py"
      - "tests/test_completed_snapshot_store.py"
  schedule:
    - cron: "17 7 1 * *"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: skogsstyrelsen-monthly-source-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Test Samråd collector and completed snapshot archive
        run: |
          python -m unittest discover -s tests -p 'test_collect_samrad.py' -v
          python -m unittest discover -s tests -p 'test_completed_snapshot_store.py' -v
      - name: Collect complete Samråd pilot layers
        if: github.event_name != 'pull_request'
        run: python scripts/collect_samrad.py
      - name: Snapshot completed-harvest pilot layer
        if: github.event_name != 'pull_request'
        run: python scripts/snapshot_completed.py
      - name: Probe planned-harvest notification service
        if: github.event_name != 'pull_request'
        run: node skogskoll/scripts/probe-source.mjs
      - name: Create or update monthly snapshot pull request
        if: github.event_name != 'pull_request'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ github.token }}
          branch: automation/skogsstyrelsen-monthly-source-audit
          delete-branch: true
          add-paths: |
            data/samrad_latest.json
            data/samrad_snapshots
            data/completed_latest.json
            data/snapshots
          commit-message: "Archive monthly Skogsstyrelsen source audit"
          title: "data: archive monthly Skogsstyrelsen source snapshots"
          body: |
            ## Monthly Skogsstyrelsen source audit

            Automated snapshots from the Gräsmyr 10 km pilot scope.

            - Samråd point, line and polygon layers were collected by the existing paginated collector.
            - Completed-harvest snapshot uses the existing scope/checkpoint/delta archive.
            - Planned-harvest probe report is attached to the originating Actions run.

            Review the run logs and snapshot manifests before merging. This PR preserves source snapshots; it does not classify missing IDs as removals or completed felling and does not authorize customer display.
      - name: Upload planned-harvest probe report
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: skogsstyrelsen-monthly-source-audit-${{ github.run_id }}
          path: skogskoll/reports/source-probe-latest.json
          if-no-files-found: warn
          retention-days: 90
