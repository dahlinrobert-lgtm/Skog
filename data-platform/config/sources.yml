# Compliance fields are a source-level screening and evidence layer; they do not constitute legal approval.
# Apply the applicable legal hierarchy and general statutory rules even when a source-specific field is silent or unknown.
# Silence/unknown metadata is not by itself a prohibition or a permission; identify the concrete unresolved legal fact.
# Restrict only the affected data/use where a specific legal or contractual obstacle is established.
# Source and rights register for the forest-specific data platform.
# Descriptive control register only: entries do not enable connectors or grant rights.
# Never put credentials, refresh tokens, API keys or personal OneDrive item IDs here.
# Rights are assessed per product/dataset, not merely per provider.
# Optional provenance blocks are being piloted on selected sources; missing blocks are not legal decisions.
# Validate structure and provenance fields with data-platform/scripts/validate_source_registry.py.

schema_version: 2
registry_checked_on: "2026-11-02"
default_rule: "Apply binding law and the legal hierarchy first. Silence or unknown source metadata is not by itself a prohibition or permission; assess the concrete use under general law and valid applicable licences/contracts, and restrict only the affected element where a specific obstacle is established."

