# Source and rights register for the forest-specific data platform.
# Descriptive control register only: entries do not enable connectors or grant rights.
# Never put credentials, refresh tokens, API keys or personal OneDrive item IDs here.
# Rights are assessed per product/dataset, not merely per provider.

schema_version: 2
registry_checked_on: "2026-11-01"
default_rule: "No commercial redistribution until the exact dataset, licence/version and API terms have been checked."

sources:
  - source_id: skogsstyrelsen.volume.omdrev3
    name: "Skogsstyrelsen – Skogliga grunddata, volym omdrev 3"
    source_type: raster
    provider: Skogsstyrelsen
    access_method: file_download
    connector: onedrive_raster
    status: pilot
    cadence: on_demand
    geography: Sweden
    format: [GeoTIFF, ZIP]
    expected_crs: EPSG:3006
    expected_units: m3sk/ha
    rights:
      licence: "CC0 1.0 as default for Skogsstyrelsen-produced geodata, unless product metadata says otherwise"
      licence_url: "https://www.skogsstyrelsen.se/e-tjanster-och-kartor/karttjanster/geodatatjanster/villkor/"
      review_status: conditional_green
      commercial_use: yes_if_product_is_covered_by_default_geodata_terms
      historical_storage: yes_if_product_is_covered_by_default_geodata_terms
      derivatives: yes_if_product_is_covered_by_default_geodata_terms
      redistribution: yes_if_product_is_covered_by_default_geodata_terms
      attribution: "Not required under CC0; recommended: Skogsstyrelsen, product name, source version/acquisition date."
      api_or_service_constraints: "Download and service availability are separate from the licence; confirm the specific product's delivery terms."
      evidence_checked_on: "2026-11-01"
      caveat: "Confirm the exact Omdrev 3 asset/product metadata and any product-specific conditions before commercial publication."
    notes:
      - Original archives are retained unchanged.
      - Zero is a valid value; NoData is tracked separately.
      - Verify product version, acquisition date and coverage for every asset.
      - OneDrive authentication is handled by existing server-side workflow secrets.

  - source_id: skogsstyrelsen.harvest_notifications
    name: "Skogsstyrelsen – avverkningsanmälningar"
    source_type: vector_observations
    provider: Skogsstyrelsen
    access_method: arcgis_rest
    connector: skogskoll_arcgis
    status: existing
    cadence: every_6_hours
    geography: Sweden
    format: [GeoJSON]
    rights:
      licence: "CC0 1.0 default for Skogsstyrelsen-produced geodata, unless otherwise stated"
      licence_url: "https://www.skogsstyrelsen.se/e-tjanster-och-kartor/karttjanster/geodatatjanster/villkor/"
      review_status: conditional_green
      commercial_use: yes_if_source_layer_is_covered_by_geodata_terms
      historical_storage: yes_if_source_layer_is_covered_by_geodata_terms
      derivatives: yes_if_source_layer_is_covered_by_geodata_terms
      redistribution: yes_if_source_layer_is_covered_by_geodata_terms
      attribution: "Recommended: Skogsstyrelsen and layer/product name."
      api_or_service_constraints: "Respect documented service behavior, pagination and reasonable request rates; technical access is not an uptime guarantee."
      evidence_checked_on: "2026-11-01"
      caveat: "Verify the exact ArcGIS layer metadata and any layer-specific notices. Do not treat notifications as proof that felling occurred."
    notes:
      - Existing Skogskoll ingestion core and Supabase persistence are authoritative for alert workflow.
      - Do not duplicate or replace existing scan/session safety logic.

  - source_id: skogsstyrelsen.statistics
    name: "Skogsstyrelsen – statistikdatabasen"
    source_type: statistics
    provider: Skogsstyrelsen
    access_method: statistics_api
    connector: to_be_implemented
    status: planned
    cadence: to_be_verified
    geography: Sweden
    format: [JSON, CSV]
    rights:
      licence: "CC0 for data in the statistics database"
      licence_url: "https://skogsstyrelse.se/statistik/bra-att-veta-om-statistiken/anvandningsvillkor/"
      review_status: green_for_statistics_data
      commercial_use: yes
      historical_storage: yes
      derivatives: yes
      redistribution: yes
      attribution: "Not required for CC0 statistical data; recommended to cite Skogsstyrelsen and retrieval date."
      api_or_service_constraints: "API may be used without special permission according to published terms; re-check query/API documentation."
      evidence_checked_on: "2026-11-01"
      caveat: "Reports, analyses and documents are CC BY, while photographs and illustrations are not covered by the free statistics-data permission. Keep these asset types separate."
    notes:
      - "Do not apply the statistics database licence to reports, images or other site content."

  - source_id: sakfraga.decisions
    name: "Sakfråga – municipal decisions"
    source_type: decision_api
    provider: Sakfråga
    access_method: rest_api
    connector: sakfraga_api
    status: pilot
    cadence: daily
    geography: Sweden
    format: [JSON]
    rights:
      licence: unknown
      review_status: amber_contract_review
      commercial_use: unknown
      historical_storage: unknown
      derivatives: unknown
      redistribution: unknown
      attribution: "To be confirmed in API terms/contract."
      api_or_service_constraints: "Review API terms, rate limits, retention and downstream-use provisions."
      evidence_checked_on: "2026-11-01"
      caveat: "Access to decision metadata through a service does not itself establish rights to commercially reuse all indexed documents or third-party attachments."
    notes:
      - Search endpoint is title-oriented and keyword results are discovery candidates.
      - Meeting-list q filtering is not decision-text search.
      - Respect API pagination and tested request limits; do not assume limit 100 works.
      - Keep meeting, decision and document identifiers distinct.

  - source_id: lansstyrelsen.public_diary
    name: "Länsstyrelsen – offentliga diarier och ärendehandlingar"
    source_type: authority_cases
    provider: Länsstyrelserna
    access_method: web_search_or_api
    connector: lansstyrelsen_diary
    status: development
    cadence: daily
    geography: Sweden
    format: [JSON, HTML, PDF]
    rights:
      licence: not_a_single_open_dataset_licence
      review_status: amber_record_by_record
      commercial_use: conditional
      historical_storage: conditional
      derivatives: conditional
      redistribution: conditional
      attribution: "Record authority, case/document identifier, URL and retrieval date."
      api_or_service_constraints: "Public access to a record is not a blanket reuse licence. Check secrecy, personal data, copyright and third-party rights per document."
      evidence_checked_on: "2026-11-01"
      caveat: "Apply public-access and reuse analysis to each record/document. Do not infer that all material in a public diary is unrestricted open data."
    notes:
      - Coverage and search behavior vary by county.
      - A zero-result response is not evidence that no relevant cases exist.
      - Separate metadata, authority-authored decisions, maps, photographs and third-party attachments.

